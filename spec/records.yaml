# The records every tool returns in the same shape, field by field. A field's `values` are
# the closed set it takes, `optional` marks one that may be left out, and `of` names the rule
# that requires it. Rendered with the conventions (docs/specification.md §1).

provenance:
  title: The provenance record
  about: >-
    Every returned item carries one, beside its identifier and status, which are fields of the
    item (A4.1, A4.4). A result with no items carries one as its own provenance field (M3.2); a
    result with items does not, the items carrying theirs. Field names are camelCase.
  fields:
    release:
      content: The release in effect, in one of two forms
      forms:
        terminology: "{ terminology, identifier, date }: the terminology and the release the call pinned"
        registry: >-
          { registry, identifier?, date? }: registry is cadsr; identifier and date are the
          registry release's, present only where caDSR publishes one (A3.8.1). Content the API
          serves without one names neither: it is newer than the export (2200604 modified
          2026-08-25, the export of 2026-07-01), so the export's date would mislabel it; the
          item's own version and dateModified identify it, with retrievedAt beside them (A3.8.2)
      of: A3.3
    source:
      content: >-
        The surface that supplied the item; cadsr_export is the caDSR export folder's listing,
        the only source of the registry's content state (A3.8.2)
      values: [evs_rest, evs_fhir, evs_index, cadsr_rest, cadsr_export, ssis_facade, ssis_sparql]
      of: A4.1
    servedBy:
      content: Where the answer came from
      values: [live, cache, index, fixture]
      of: A4.1
    retrievedAt:
      content: When it was retrieved, ISO-8601
      of: A4.1
    sourceUri:
      content: The upstream URL that produced the item
      of: A4.1
    correlationId:
      content: The call's correlation identifier
      of: M7.1
    graphs:
      content: >-
        For items served by the Shared SI Service: each graph touched, { graph, version?, date }:
        its IRI, its owl:versionInfo where it has one, and its dc:date, ISO-8601
      of: A1.5
    registry:
      content: >-
        The registry state, { registry, identifier?, date? } as the registry form of release
        gives it, beside release in its terminology form: present exactly where an item of a
        cross-domain or workflow tool rests on caDSR content, so that the item names both
        content states
      optional: true
      of: A1.5
    attribution:
      content: >-
        The licence text the platform's answer gave with the item, unchanged: present exactly
        where that answer carried licence text for it
      optional: true
      of: A7.3
    upstream:
      content: >-
        The fields the platform supplied about the item's origin, under its names and with its
        values; at least: from EVS REST the item's terminology and version; from EVS FHIR the
        value set's url and version; from caDSR the item's public id and version, as each API
        names them (publicId, the Form API's publicID, the CRDC list's CDE Public ID and Version,
        vmMatch's itemId); from the Shared SI Service the identity and date of each graph
      of: A4.3
traversal:
  title: The provenance record of an item reached by traversal
  about: The provenance record, with these fields added (A4.2).
  fields:
    depth:
      content: Steps from the concept the caller asked about; an edge has the depth of the item it reaches
      of: A4.2
    relationship:
      content: >-
        The relationship that brought the item in: { code?, name, kind }; code is absent where
        the platform names none, as for computed associations; such a relationship is positive.
        The code decides polarity. Hierarchy links carry only their kind, with no invented code or name.
      of: A5.7
    direction:
      content: Whether the assertion points outward from the origin or inward to it
      of: A4.2
    polarity:
      content: >-
        Negative exactly when the relationship's code is in its terminology's exclusion set
        below, positive otherwise, whatever the relationship is named (A5.7); the set is
        checked against the release's relationship catalogue (the relationship record)
      values: [positive, negative]
      exclusions: {ncit: [R135, R136, R137, R138, R139, R140, R141, R142]}
      of: A5.6
    qualifiers:
      content: Any qualifying detail the platform attaches
      of: A4.2
    evidence:
      content: Supporting evidence, where the platform supplies it
      of: A4.2
concept:
  title: The concept record
  about: >-
    A concept as a terminology tool returns it: these fields, status where the platform
    publishes one, and the sections the caller's include selects. Status is the platform's own,
    unchanged: a status set of the module's would lose what the platform said and differ between
    terminologies (A9.1).
  fields:
    code:
      content: The bare code the terminology publishes
      of: A1.2
    terminology:
      content: The terminology the code belongs to, as the platform names it
      of: A1.2
    name:
      content: The preferred name
      of: A4.1
    active:
      content: Whether the platform publishes the concept as active, its boolean unchanged
      of: A8.1
    status:
      content: >-
        The platform's own status value, unchanged, where it publishes one (from EVS:
        DEFAULT, Header_Concept, Retired_Concept, ...)
      optional: true
      of: A8.1
    provenance:
      content: The provenance record
      of: A4.4
    synonyms:
      content: The platform's synonym entries, unchanged, when include selects them
      optional: true
      of: get_concept
    definitions:
      content: The platform's definition entries, unchanged, when include selects them
      optional: true
      of: get_concept
    properties:
      content: >-
        The platform's property entries, unchanged, when include selects them; the
        semantic-type property among them
      optional: true
      of: get_concept
    semanticType:
      content: >-
        The values of the terminology's semantic-type property, when include selects them; the
        property is named by its code, not its label (NCIt: P106), as A5.7 names roles
      optional: true
      of: get_concept
node:
  title: The node record
  about: >-
    A concept reached by traversal, as get_concept_hierarchy and get_concept_neighborhood
    return it, each concept once, with its status as the concept record carries it (A8.1). A
    relation list names a neighbour by code and name only, so the tool reads the nodes of the
    last depth, which it follows no further, for their status: in batches at the minimal
    include, bounded by the node bound.
  fields:
    code:
      content: The bare code the terminology publishes
      of: A1.2
    terminology:
      content: The terminology the code belongs to, as the platform names it
      of: A1.2
    name:
      content: The preferred name
      of: A4.1
    active:
      content: Whether the platform publishes the concept as active, its boolean unchanged
      of: A8.1
    status:
      content: The platform's own status value, unchanged, where it publishes one
      optional: true
      of: A8.1
    provenance:
      content: >-
        The traversal record: depth 0 and no relationship for the concept asked about, and for
        any other the depth and the relationship of an edge that reached it there
      of: A4.2
edge:
  title: The edge record
  about: >-
    One assertion between two concepts, as get_concept_neighborhood returns it, in the
    direction the platform states it: a role or association from the concept holding it to
    its target, a hierarchy link from child to parent.
  fields:
    sourceCode:
      content: The bare code of the assertion's subject
      of: A1.2
    sourceTerminology:
      content: The terminology of the subject
      of: A1.2
    targetCode:
      content: The bare code of the assertion's object
      of: A1.2
    targetTerminology:
      content: The terminology of the object
      of: A1.2
    provenance:
      content: >-
        The traversal record: the depth of the node it reaches, its relationship
        { code, name, kind }, direction and polarity
      of: A4.2
subset:
  title: The subset record
  about: >-
    A subset a concept belongs to, as get_concept_subsets returns it: the platform's
    Concept_In_Subset associations of the concept, read with it, in the platform's order.
  fields:
    code:
      content: The bare code of the subset concept
      of: A1.2
    terminology:
      content: The terminology the subset belongs to, as the platform names it
      of: A1.2
    name:
      content: The subset's name, as the association names it
      of: A9.1
    provenance:
      content: The provenance record
      of: A4.4
mapping:
  title: The mapping record
  about: >-
    A map the platform carries on a concept, from it to another terminology, as
    get_concept_mappings returns it: the platform's map unchanged, in the platform's order.
    Its provenance names the release of the concept it was read from; the target's own version
    is the map's.
  fields:
    targetCode:
      content: The target's code, as the platform gives it
      of: A9.1
    targetTerminology:
      content: The target terminology, as the platform names it on the map
      of: A9.1
    targetName:
      content: The target's name
      of: A9.1
    targetTermType:
      content: The target's term type, where the platform gives one; absent, never null, where it does not
      optional: true
      of: A9.1
    targetTerminologyVersion:
      content: >-
        The target terminology's version, where the platform gives one; absent, never null,
        where it does not
      optional: true
      of: A9.1
    type:
      content: The map's relation (EVS's type, such as Related To or Has Synonym), unchanged
      of: A9.1
    provenance:
      content: The provenance record
      of: A4.4
replacement:
  title: The replacement record
  about: A concept the platform names as replacing a retired one, as resolve_retired_code returns it.
  fields:
    code:
      content: The bare code of the replacement
      of: A1.2
    terminology:
      content: The terminology it belongs to, as the platform names it
      of: A1.2
    name:
      content: The replacement's name, as the platform gives it
      of: A9.1
    provenance:
      content: The provenance record
      of: A4.4
relationship:
  title: The relationship record
  about: >-
    A role or association of a release's relationship catalogue, as list_relationships returns
    it. The tool, and get_concept_neighborhood, fail closed with internal_error for a release
    whose catalogue lacks a code of the terminology's exclusion set, naming the codes in
    details. The check catches a set code the release no longer has, not a new exclusion
    relationship the set does not know: that needs the catalogue to mark polarity, which is
    the platform's to add.
  fields:
    code:
      content: The relationship's code
      of: A5.7
    terminology:
      content: The terminology whose catalogue it is, as the platform names it
      of: A1.2
    name:
      content: Its name in the catalogue, unchanged
      of: A9.1
    kind:
      content: Whether it is a role or an association
      values: [role, association]
      of: A4.2
    polarity:
      content: As in the traversal record, by code
      values: [positive, negative]
      of: A5.7
    provenance:
      content: The provenance record
      of: A4.4
search_result:
  title: The search result record
  about: >-
    One result of search_concepts, in the order the source ranked it: the module ranks and
    scores nothing itself (A9.2), except through the interim index (M4.1).
  fields:
    concept:
      content: The concept record, with no section
      of: concept
    score:
      content: >-
        The score the source returned, unchanged: the interim index's (M4.1); absent where the
        source returns none (EVS)
      optional: true
      of: A9.2
    matchedOn:
      content: >-
        Where the match was found, as the source says it: from EVS its highlight, unchanged
        (the matched text, the query's terms marked); from the interim index the field
        matched, name, synonym or definition. Its form follows the mode the caller asked for. Absent where the source says
        nothing (EVS typeahead), never null
      optional: true
      of: A9.2
member:
  title: The value set member record
  about: >-
    A member of a value set, as expand_value_set returns it. count and offset select a page of
    the members in the platform's order, and total counts every member activeOnly keeps, so a
    page is no truncation: truncation reports a bound of the tool's own (A5.2).
  fields:
    code:
      content: The bare code the terminology publishes
      of: A1.2
    terminology:
      content: The terminology the code belongs to, as the platform names it
      of: A1.2
    name:
      content: The platform's display text for the member, unchanged
      of: A9.1
    inactive:
      content: >-
        true where the expansion marks the member inactive (FHIR contains.inactive: no longer
        active, retired members among them), and absent, never false or null, where it does
        not; activeOnly leaves such members out (A8.3)
      optional: true
      of: A8.1
    provenance:
      content: The provenance record
      of: A4.4
terminology:
  title: The terminology record
  about: A terminology the platform serves, as list_terminologies returns it.
  fields:
    terminology:
      content: The terminology's identifier, as the platform's metadata names it
      of: A7.1
    release:
      content: Its current release identifier
      of: A7.2
    provenance:
      content: The provenance record
      of: A4.4
registry_release:
  title: The registry release record
  about: >-
    The registry's content state, as resolve_registry_release returns it. caDSR publishes no
    registry release today, so the export's date stands for it and no identifier is invented
    (A3.8).
  fields:
    published:
      content: Whether caDSR publishes a registry release; false today
      of: A3.8.1
    identifier:
      content: The registry release, present only where caDSR publishes one
      optional: true
      of: A3.8.1
    generatedAt:
      content: >-
        When the content was generated, ISO-8601: the release's own date where one is
        published, otherwise the export's date as the export folder gives it (A3.8.2)
      of: A3.8.2
    sourceDistribution:
      content: The distribution generatedAt is read from (today releasedCDEsXML-OD.zip)
      of: A3.8.2
data_element:
  title: The data element record
  about: >-
    A data element as a caDSR tool returns it: these fields, the platform's own, and the
    sections the caller's include selects; no include returns these fields alone. Names follow
    the caDSR API's (DataElement), statuses unchanged (A9.1).
  fields:
    publicId:
      content: The data element's public id
      of: A1.2
    version:
      content: The data element's own version, never the registry's state
      of: A3.8.3
    longName:
      content: Its long name
      of: A4.1
    context:
      content: The context that owns it
      of: A3.8.3
    workflowStatus:
      content: The platform's workflow status, unchanged (RELEASED, RETIRED ARCHIVED, ...)
      of: A3.8.3
    registrationStatus:
      content: The platform's registration status, unchanged (Standard, Application, ...)
      of: A3.8.3
    dateCreated:
      content: When the platform created it, its own value unchanged
      of: A3.8.2
    dateModified:
      content: When the platform last modified it, its own value unchanged
      of: A3.8.2
    provenance:
      content: The provenance record, its release in the registry form
      of: A4.4
    permissibleValues:
      content: The permissible value records of its value domain, when include selects them
      optional: true
      of: get_data_element
    valueDomain:
      content: >-
        The platform's value domain fields, unchanged but for its permissible values, which
        permissibleValues holds, when include selects it
      optional: true
      of: get_data_element
    conceptAssociations:
      content: >-
        The concepts of its data element concept, each { conceptCode, longName, role }, role
        objectClass or property, as the platform's ObjectClass and Property give them, when
        include selects them
      optional: true
      of: get_data_element
    alternateNames:
      content: The platform's alternate name entries, unchanged, when include selects them
      optional: true
      of: get_data_element
    classificationSchemes:
      content: The classification scheme records it is classified in, when include selects them
      optional: true
      of: get_data_element
permissible_value:
  title: The permissible value record
  about: A permissible value of a value domain, with the value meaning it stands for.
  fields:
    publicId:
      content: >-
        The identifier caDSR REST publishes for it; no platform operation retrieves a value by
        it yet (OP-C10)
      of: A1.2
    value:
      content: The value as stored
      of: A9.1
    valueMeaning:
      content: >-
        Its value meaning: { publicId, version, longName, concepts[] }, each concept
        { conceptCode, longName, primary } as the platform gives it
      of: A9.1
    provenance:
      content: The provenance record, its release in the registry form
      of: A4.4
classification_scheme:
  title: The classification scheme record
  about: >-
    A classification scheme as an object with its nested items (A7.2). The platform lists
    none on their own today (OP-C13): a data element carries the schemes it is classified in.
  fields:
    publicId:
      content: The scheme's public id
      of: A1.2
    version:
      content: The scheme's version
      of: A3.8.3
    longName:
      content: Its long name
      of: A4.1
    context:
      content: The context that owns it
      of: A7.2
    items:
      content: Its classification scheme items, each { publicId, version, longName }
      of: A7.2
    provenance:
      content: The provenance record, its release in the registry form
      of: A4.4
context:
  title: The context record
  about: >-
    A context of the registry, as list_contexts returns it. The platform publishes a context
    by its name alone, so the name is its identifier (A7.2).
  fields:
    name:
      content: The context's name, its identifier
      of: A7.2
    provenance:
      content: The provenance record, its release in the registry form
      of: A4.4
data_element_match:
  title: The data element match record
  about: One match of match_data_elements, in the platform's order, each entity's after the one before.
  fields:
    entity:
      content: The name of the entity it matches, as the caller gave it
      of: match_data_elements
    dataElement:
      content: The data element record, with no section
      of: data_element
    score:
      content: The platform's score, unchanged
      of: A9.2
    rule:
      content: The rule the platform says matched (CDE Match's ruleDescription), unchanged
      of: A9.2
    matchedText:
      content: The text the platform says matched, unchanged
      of: A9.2
value_meaning_match:
  title: The value meaning match record
  about: One match of match_value_meanings, in the platform's order.
  fields:
    item:
      content: >-
        The item matched, as vmMatch gives it: { itemType, publicId, version, name, concept?,
        evsSource?, context, workflowStatus, registrationStatus?, provenance }. itemType is
        Concept or ValueMeaning, publicId that item's caDSR public id (itemId), name its
        matchedName; concept is the code it stands for, in the code system evsSource names
        (NCI_CONCEPT_CODE, SNOMED-CT_CODE, ...), each absent where the platform gives none;
        registrationStatus is absent, never null, where the platform gives none
      of: A9.1
    rule:
      content: The rule the platform says matched (vmMatch's ruleDescription), unchanged
      of: A9.2
    score:
      content: The platform's score, where it gives one; absent, never null, where it does not (vmMatch gives none)
      optional: true
      of: A9.2
    crosswalk:
      content: >-
        The crosswalk the platform gives, { code, description } from crosswalkCode and
        crosswalkDescription; absent where it gives none, an empty code or the platform's
        NA meaning no crosswalk
      optional: true
      of: match_value_meanings
form:
  title: The form record
  about: A form as get_form returns it, its status the platform's own (A8.1).
  fields:
    publicId:
      content: The form's public id (the Form API's publicID)
      of: A1.2
    version:
      content: The form's version
      of: A3.8.3
    longName:
      content: Its long name
      of: A4.1
    context:
      content: The context that owns it
      of: A3.8.3
    workflowStatus:
      content: The platform's workflow status, unchanged (RETIRED ARCHIVED is surfaced, not hidden)
      of: A8.1
    registrationStatus:
      content: The platform's registration status, unchanged
      of: A3.8.3
    dateCreated:
      content: When the platform created it, its own value unchanged
      of: A3.8.2
    dateModified:
      content: When the platform last modified it, its own value unchanged
      of: A3.8.2
    provenance:
      content: The provenance record, its release in the registry form
      of: A4.4
    modules:
      content: >-
        Its modules in the platform's order, each with its questions, the platform's entries
        unchanged; absent when includeModules is false
      optional: true
      of: get_form
code_map:
  title: The code map record
  about: >-
    The values one data element of the CRDC crosswalk binds to concepts, with the contexts and
    commons that use it, as get_code_map returns it. The values do not vary by user.
  fields:
    dataElement:
      content: "{ publicId, version } of the data element"
      of: A1.2
    crdcName:
      content: Its CRDC name, as the platform gives it
      of: A9.1
    usedBy:
      content: >-
        The contexts and commons that use it, the platform's Used By names split at their
        commas (CRDC, GDC, Pediatric Cancer, CTEP, ...); empty where it names none
      of: get_code_map
    valueLevelBinding:
      content: >-
        Whether the data element binds values to concepts, which it does where the platform
        gives its permissible values; false says so rather than returning no values
      of: get_code_map
    coverage:
      content: The number of its values bound to a concept code
      of: get_code_map
    values:
      content: >-
        Its values, each { value, conceptCode? }, as the platform gives them: conceptCode
        colon-joined where it names several (C15388:C20821), absent where it names none
      of: A9.1
    provenance:
      content: The provenance record, its release in the registry form
      of: A4.4
data_element_use:
  title: The data element use record
  about: >-
    A data element that uses a concept, as find_data_elements_for_concept returns it: as an
    object class, property or permissible value concept, main or minor, of the concept or, with
    expandDescendants, of a descendant. The surface its provenance names answered it; the
    surfaces answer from their own content (the Shared SI graph is an export, the caDSR API is
    live), so their answers differ, and neither says by which route the concept is used.
  fields:
    dataElement:
      content: "{ publicId, version, longName } of the data element"
      of: A1.2
    provenance:
      content: >-
        The provenance record: release in the terminology form, the NCIt release the surface
        used where it names one; registry; graphs where the Shared SI Service served it
      of: A1.5
value_use:
  title: The permissible value use record
  about: >-
    A permissible value whose value meaning stands for a concept, as the reverse lookup of
    find_data_elements_for_concept and ground_value return it. Permissible values have no
    identifier in the Shared SI projection (blank nodes, S-3), so it is named by its data
    element and its value.
  fields:
    dataElement:
      content: "{ publicId, version } of the data element whose value domain holds it"
      of: A1.2
    value:
      content: The value, as the platform gives it
      of: A9.1
    conceptCode:
      content: >-
        The bare code of the concept its value meaning stands for: the concept asked about or,
        with expandDescendants, a descendant
      of: A1.2
    conceptTerminology:
      content: The terminology of that concept, beside its code
      of: A1.2
    provenance:
      content: The provenance record, as for the data element use record
      of: A1.5
stored_value:
  title: The stored value record
  about: A literal a data commons stores for a concept, as resolve_stored_value returns it.
  fields:
    value:
      content: The literal, as its source gives it (GDC through the mapset, the map's targetName)
      of: A9.1
    field:
      content: >-
        The commons' property it is stored under, as its source gives it (GDC through the
        mapset, the map's targetCode, such as primary_diagnosis)
      of: A9.1
    source:
      content: >-
        The published source that asserts it: { mapset, version } for an EVS mapset, or
        { crosswalk, dataElement { publicId, version } } for the CRDC crosswalk
      of: resolve_stored_value
    provenance:
      content: The provenance record
      of: A4.1
dataset_release:
  title: The dataset release record
  about: One dataset a cross-domain answer rests on, as get_release_alignment returns it.
  fields:
    name:
      content: The dataset
      values: [ncit, ssis_ncit_graph, ssis_cadsr_graph, cadsr_export]
      of: A3.7.1
    version:
      content: Its release identifier (26.09d), absent where it has none
      optional: true
      of: A3.8.1
    date:
      content: >-
        Its date, ISO-8601, normalised from the form its source gives (the NCIt graph's
        "September 28, 2026", the caDSR graph's "2026-07-01", the export's listing)
      of: A3.7.1
    provenance:
      content: The provenance record
      of: A4.1
excluded_code:
  title: The excluded code record
  about: >-
    An exclusion assertion of the concept expand_cohort is asked about, one record each: the
    code it names, withheld from the cohort's codes unless includeNegative, with the assertion.
  fields:
    code:
      content: The bare code
      of: A1.2
    terminology:
      content: Its terminology
      of: A1.2
    edge:
      content: The edge record of the exclusion assertion
      of: edge
    provenance:
      content: The traversal record of the code, as the edge reaching it has it
      of: A4.2
truncation:
  title: The truncation record
  about: >-
    The truncation field of a result whose tool bounds it. When nothing was truncated it holds
    occurred false and no other field. When a bound was reached it holds occurred, bound, limit,
    reached, omitted and exact, and perKind as well where a traversal spans several
    relationship kinds. A page that a cursor or an offset continues is not a truncation (M6.1).
  fields:
    occurred:
      content: Whether a bound was reached
      of: A5.4
    bound:
      content: Which bound was reached
      values: [results, depth, nodes, edges, kind_budget, requests, upstream_cap]
      optional: true
      of: A5.4
    limit:
      content: The value of that bound
      optional: true
      of: A5.1
    reached:
      content: The amount counted against the bound when it stopped
      optional: true
      of: A5.4
    omitted:
      content: How much was left out, always a number
      optional: true
      of: A5.4
    exact:
      content: False when omitted is a lower bound or an estimate
      optional: true
      of: A5.4
    perKind:
      content: >-
        For a traversal over several relationship kinds: a map from each kind to its own
        truncation record; occurred is true when any kind's budget was reached
      optional: true
      of: A5.5
    perHop:
      content: >-
        For a workflow: a map from each hop (dataElements, permissibleValues, storedValues) to
        its own truncation record; occurred is true when any hop's bound was reached
      optional: true
      of: ground_value
index_manifest:
  title: The index manifest record
  about: >-
    The manifest of the interim NCIt index (M4.1), as the index_manifest resource returns it: the
    release the index holds and how it was built. Its terminology and version name the release
    resolve_release names for the pinned release, and only those two are compared with it. Only
    an active index is served, so the record carries no activation state.
  fields:
    terminology:
      content: The terminology indexed, ncit
      of: M4.1
    version:
      content: The release the index holds, in the form resolve_release names it
      of: M4.1
    concepts:
      content: The number of concepts the index holds, a positive integer
      of: M4.1
    embedding:
      content: "{ provider, model, dimensions } of the embedding as the index records it"
      of: M4.1
    builtAt:
      content: When the index was built, ISO-8601
      of: M4.1
    provenance:
      content: The provenance record, its source evs_index and servedBy index
      of: A4.4
error:
  title: The error record
  about: >-
    A failed call returns { error } as its structuredContent, with isError set (M3.2); it never
    resembles an empty result (A2.5).
  fields:
    code:
      content: >-
        The class of the failure: those A2.5 names, a release mismatch (A3.4), a timeout, a
        capability not yet available (M1.2) and a cursor whose release is superseded (M2.4).
        release_not_available also covers a channel whose current release cannot be named, as
        when one channel's query names two releases (A3.6.3)
      values: [invalid_request, not_found, release_not_available, release_mismatch,
               upstream_unavailable, timeout, bound_exceeded, capability_unavailable,
               cursor_expired, internal_error]
      of: A2.5
    message:
      content: What failed, in words
      of: A2.5
    details:
      content: >-
        An object holding what the caller needs for its next step, such as the release requested
        and the release served, the bound, its limit and the amount reached, or the surface,
        status and attempts of a failed upstream request
      optional: true
      of: A2.5
    correlationId:
      content: The call's correlation identifier
      of: M7.1
  detail_keys:
    invalid_request:
      parameter: The argument, or the setting, that was refused
      reason: Why it was refused, in words
    not_found:
      identifiers: The list of identifiers that were not found
    release_not_available:
      requested: The release, or the channel, that was asked for
      source: Where the release could not be named, evs, cadsr or index
      found: The releases the channel's query named, where it named more than one (A3.6.3)
    release_mismatch:
      requested: The release that was asked for
      served: The list of releases the content came from, one element where it is a single release
      source: Where the content came from, evs, cadsr or index
    upstream_unavailable:
      surface: The platform that failed, such as evs
      status: The HTTP status of the last failed request, where there was one
      attempts: The number of requests made
      retryAfter: The Retry-After the platform sent, where it sent one
    timeout:
      surface: The platform that did not answer, such as evs
      seconds: The seconds waited for each attempt
      attempts: The number of requests made, each of which timed out
    bound_exceeded:
      bound: The name of the bound that was exceeded
      limit: The value of the bound
      reached: >-
        The amount reached; where a response size is bounded and the platform declared no
        length, the limit plus one, since reading stops one byte past the bound
    capability_unavailable:
      capability: The capability that is not yet available
    cursor_expired:
      cursorRelease: The release the cursor was issued against
      currentRelease: The current release, which supersedes it
    internal_error:
      missingCodes: The exclusion codes of the terminology's set that the release's catalogue lacks
