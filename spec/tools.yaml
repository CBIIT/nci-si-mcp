# The required MCP tools: for each, its group, its inputs and result (a trailing ? marks an
# optional argument, | alternatives), the values an enumerated argument takes, and what it
# does. Groups: evs, cadsr, cross-domain and workflow. The conventions of
# conventions.yaml apply to every tool; requirements.yaml says what the suite tests of each.
#
# `items` says where a result's items are, each carrying its provenance (A4.4): "." is the
# result itself, `nodes[]` each element of the result's `nodes`, and `results[].concept` the
# concept of each element of its `results`. A tool with items is content-returning, and the
# cross-cutting requirements apply to it. `traversal: true` marks a tool whose items are
# reached by traversal (A4.2).
#
# `defaults` gives the default of an optional argument that bounds nothing; an argument with
# bounds has its default there. A call that leaves an optional argument out is the call that
# gives it as its default (M6.1).
#
# `requests` is the most upstream requests one call of the tool makes, retries included (A5.2,
# A5.3); reaching it truncates the result with bound `requests`. No argument sets it.
#
# `computed: true` marks a tool whose result is computed from caller-supplied values: ttlMs 0
# and cacheScope private (M2.2, M2.3).
#
# `lists` gives the most elements an input list takes in one call; a longer list is an
# invalid request, since dropping a caller's input would answer another question (A5.2).
#
# `patterns` gives the stated form of each identifier argument that goes into an upstream path
# or query text (A7.6), as a regular expression the whole value matches: a trailing newline is
# off the form; a mapping by terminology where only some terminologies have one (NCIt codes).
# An identifier without a stated form is sent as one encoded path segment or parameter value.
# An input schema may state a form, but an argument off it is answered with the error record,
# invalid_request, as every invalid request is (A2.5). `free_text` names the free-text arguments
# that go upstream (A7.7); `entities[].name` is the name of each element of `entities`.
#
# `not_offered` names what the platform has and the tool does not expose: argument values
# under the argument's name, and platform features under a name of their own (`evs_type`,
# EVS search types no mode maps to). No description or schema shows one as a value (P-11).
#
# `bounds` gives the default and the maximum of each argument that bounds a result (A5.1,
# A5.2). A value above the maximum is applied as the maximum; where content was dropped, the
# truncation record's limit is the value applied. So the input schema states no maximum that
# would refuse such a value: the argument's description states its default and maximum. A value
# below 1 is an invalid request, never raised to 1. An argument without a default has none
# by design: the tool's summary says what it does when the argument is not given.

resolve_release:
  title: Current terminology release
  group: evs
  inputs: (terminology, channel?)
  patterns: {terminology: &terminology "^[a-z][a-z0-9_]*$"}
  returns: "{ terminology, channel, version, date, alternatives[] }"
  items: ["."]
  summary: Which release of a terminology is current, by channel (without one, the channel configured, A3.6.2); called explicitly for discovery; NCIt content calls may instead omit release under X-22.
get_concept:
  title: Concept details
  group: evs
  inputs: (terminology, release?, code, include[]?)
  patterns:
    terminology: *terminology
    release: &release "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    code: &code {ncit: &ncit_code "^C[1-9][0-9]*$"}
  returns: concept
  items: ["."]
  values: {include: [synonyms, definitions, properties, semanticType]}
  not_offered: {include: [descendants]}
  summary: One concept with the detail selected.
get_concepts:
  title: Concept details in bulk
  group: evs
  inputs: (terminology, release?, codes[], include[]?)
  lists: {codes: 650}
  patterns: {terminology: *terminology, release: *release, codes: *code}
  returns: "{ concepts[], missing[] }"
  items: ["concepts[]"]
  values: {include: [synonyms, definitions, properties, semanticType]}
  summary: Many concepts in one platform call, with the detail selected.
search_concepts:
  title: Terminology search
  group: evs
  inputs: (terminology, release?, query, mode?, limit?, cursor?, retired?)
  patterns: {terminology: *terminology, release: *release}
  free_text: [query]
  returns: "{ results[{ concept, score?, matchedOn? }], nextCursor?, totalKnown? }"
  items: ["results[].concept"]
  values: {mode: [lexical, typeahead, semantic, hybrid], retired: [include, only]}
  bounds: {limit: {default: 10, maximum: 1000}}
  defaults: {mode: lexical, retired: include}
  not_offered: {retired: [exclude], evs_type: [match, phrase, AND, OR, fuzzy]}
  summary: >-
    Ranked search of a terminology; semantic and hybrid from the interim NCIt index (M4.1).
    Retired concepts are returned with the others (retired include, the default, as the
    platform returns them), or alone (retired only), where retirement is a concept status the
    search can select: the listing's metadata.retiredStatusValue is among its
    metadata.conceptStatuses, and that status is what is sent. On 2 October 2026 this holds
    for NCIt alone. Every mode takes the same two values. Search cannot leave retired
    concepts out: the platform offers no such selection, and each result's active and status
    let a caller drop them itself.
get_concept_hierarchy:
  title: Concept hierarchy
  group: evs
  inputs: (terminology, release?, code, direction, depth?, limit?, cursor?)
  patterns: {terminology: *terminology, release: *release, code: *code}
  returns: "{ nodes[], paths[]?, truncation, nextCursor? }"
  items: ["nodes[]"]
  traversal: true
  values: {direction: [parent, child, pathsToRoot]}
  bounds: {depth: {default: 1, maximum: 4}, limit: {default: 200, maximum: 1000}}
  requests: 200
  summary: >-
    A concept's parents, children or paths to the root, bounded. nodes holds the concepts
    reached, not the one asked about, and limit is a page that the cursor continues.
    pathsToRoot returns each path the platform gives in paths, the codes from the concept to
    the root in the platform's order, with each concept on them once in nodes; depth, limit
    and cursor do not apply to it.
expand_value_set:
  title: Subset members
  group: evs
  inputs: (terminology, release?, valueSet | code, count?, offset?, activeOnly?)
  patterns: {terminology: *terminology, release: *release, valueSet: *code, code: *code}
  returns: "{ members[], total, truncation }"
  items: ["members[]"]
  values: {terminology: [ncit]}
  bounds: {count: {default: 200, maximum: 1000}}
  defaults: {offset: 0, activeOnly: false}
  summary: >-
    The members of a value set, paged and bounded by the tool itself. It pages by count and offset, as FHIR $expand
    does, in place of a cursor (the exception to M6.1); activeOnly is false unless given.
get_concept_neighborhood:
  title: Concept relationships
  group: evs
  inputs: (terminology, release?, code, depth?, kinds[]?, maxNodes?, maxEdges?, budgetPerKind?, includeNegative?)
  patterns: {terminology: *terminology, release: *release, code: *code}
  returns: "{ nodes[], edges[], truncation }"
  items: ["nodes[]", "edges[]"]
  traversal: true
  values: {kinds: [parent, child, role, association, inverseRole, inverseAssociation]}
  bounds:
    depth: {default: 2, maximum: 4}
    maxNodes: {default: 200, maximum: 1000}
    maxEdges: {default: 1000, maximum: 5000}
    budgetPerKind: {maximum: 1000}
  requests: 200
  summary: >-
    Bounded traversal across roles and associations with a budget per kind; nodes holds the
    concept asked about at depth 0 and those reached, and maxNodes counts them all. Given,
    budgetPerKind bounds the nodes each kind adds; not given, the tool shares maxNodes among
    the kinds asked so that none present is starved, in a way of its own. Negative assertions
    are returned marked, with the nodes they reach, which are not followed further unless
    includeNegative.
get_concept_subsets:
  title: Concept subset membership
  group: evs
  inputs: (terminology, release?, code)
  patterns: {terminology: *terminology, release: *release, code: *code}
  returns: "{ subsets[] }"
  items: ["subsets[]"]
  summary: The subsets a concept belongs to.
get_concept_mappings:
  title: Cross-terminology mappings
  group: evs
  inputs: (terminology, release?, code, targetTerminology?)
  patterns: {terminology: *terminology, release: *release, code: *code}
  returns: "{ mappings[] }"
  items: ["mappings[]"]
  summary: >-
    The maps the platform carries on a concept, from it to other terminologies, unchanged and
    each with its target's version where the platform gives one; maps into the terminology
    from others are not this tool's. targetTerminology keeps the maps whose target the
    platform names exactly so, case included.
resolve_retired_code:
  title: Retired concept replacements
  group: evs
  inputs: (terminology, release?, code)
  patterns: {terminology: *terminology, release: *release, code: *code}
  returns: "{ code, terminology, active, status?, replacements[] }"
  items: [".", "replacements[]"]
  summary: >-
    Whether a code is retired (active false, as the platform publishes it), its status, and
    what the platform names as replacing it: replacements is an empty list, present, where the
    platform names none, retired or not.
list_relationships:
  title: Relationship types
  group: evs
  inputs: (terminology, release?)
  patterns: {terminology: *terminology, release: *release}
  returns: "{ relationships[] }"
  items: ["relationships[]"]
  summary: The relationship catalogue of a release, polarity marked by code.
list_terminologies:
  title: Available terminologies
  group: evs
  inputs: ()
  returns: "{ terminologies[] }"
  items: ["terminologies[]"]
  summary: The terminologies available, with their current releases.

resolve_registry_release:
  title: Registry content state
  group: cadsr
  inputs: ()
  returns: registry_release
  summary: >-
    The registry's content state: published false and the export's date while caDSR publishes
    no registry release, never an invented identifier; the release itself where one is.
get_data_element:
  title: Data element details
  group: cadsr
  inputs: (publicId | longName | questionText, version?, include[]?, registryRelease?)
  patterns: {publicId: &registry_id "^[1-9][0-9]*$", version: &registry_version "^[0-9]+([.][0-9]+)?$"}
  free_text: [questionText]
  returns: data_element
  items: ["."]
  values: {include: [permissibleValues, valueDomain, conceptAssociations, alternateNames, classificationSchemes, referenceDocuments]}
  summary: >-
    One data element, at its latest version or the version given, with the sections include
    selects; without include, the record's own fields. questionText finds it by its preferred
    question text, an invalid request naming the candidates where several have it and not_found
    where none has; longName is capability_unavailable until the platform serves that lookup
    (OP-C02). Item versions compare by exact numeric value (4 equals 4.0); request spelling
    and the upstream version string in content and provenance are preserved.
search_data_elements:
  title: Data element search
  group: cadsr
  inputs: (query, mode?, filters?, limit?, cursor?, registryRelease?)
  free_text: [query]
  returns: "{ results[{ dataElement, score?, matchedOn? }], nextCursor?, totalKnown?, truncation }"
  items: ["results[].dataElement"]
  values: {mode: [lexical, semantic, hybrid], filters: [context, workflowStatus, registrationStatus, valueDomainType]}
  bounds: {limit: {default: 10, maximum: 100}}
  defaults: {mode: lexical}
  summary: >-
    Search of data elements, filtered by context, status and value-domain type, a page at a
    time up to the platform's cap of 1,000 results a query, which truncation reports
    (upstream_cap). semantic and hybrid are capability_unavailable until the platform serves
    them (OP-C04).
match_data_elements:
  title: Data element candidates
  group: cadsr
  inputs: "(entities[{ name, userTip?, permissibleValues[]? }], matchLimit?, modelVariant?, similarityThreshold?, filters?, registryRelease?)"
  free_text: ["entities[].name", "entities[].userTip", "entities[].permissibleValues[]"]
  returns: "{ matches[data_element_match] }"
  items: ["matches[].dataElement"]
  values: {filters: [context, workflowStatus, registrationStatus, classificationScheme, valueDomainType]}
  bounds: {matchLimit: {default: 10, maximum: 100}}
  lists: {entities: 10}
  computed: true
  summary: >-
    Data elements matched to described entities, scored and rule-attributed, at most
    matchLimit for each entity; the contract's default is 10, and the maximum of 100 is this
    specification's, the contract stating none. The classificationScheme filter takes both
    publicId and version. modelVariant and similarityThreshold, which the
    platform does not take, are an invalid request when given. At most 10 entities a call: the
    contract states no maximum, and one entity took 28.9 s (10 September 2026) against a match
    timeout of 45 s.
match_value_meanings:
  title: Value meaning candidates
  group: cadsr
  inputs: (values[], strictness?, terminologyScope?, registryRelease?)
  free_text: ["values[]"]
  returns: "{ matches[value_meaning_match] }"
  items: ["matches[].item"]
  values: {strictness: [restricted, unrestricted]}
  defaults: {strictness: restricted}
  lists: {values: 10}
  computed: true
  summary: >-
    Value meanings and concepts matched to values, each rule-attributed with its crosswalk and
    with the matched item's definition where vmMatch gives one; strictness is vmMatch's matchType, terminologyScope its evsTerminologyCodes. At most 10
    values a call: the contract states no maximum, and one value took 15.5 s (10 September
    2026) against a match timeout of 45 s.
get_form:
  title: Form details
  group: cadsr
  inputs: (publicId? | keyword?, version?, includeModules?, registryRelease?)
  patterns: {publicId: *registry_id, version: *registry_version}
  returns: form
  items: ["."]
  defaults: {includeModules: true}
  summary: >-
    A form or case report form by public id, with its definition, type, dates, instructions and
    classification schemes as the platform gives them, and its modules and questions; a keyword
    is an invalid request saying the platform needs an identifier (Form/query takes a public or
    protocol id only). Item versions compare by exact numeric value (1 equals 1.0); request
    spelling and the upstream version string in content and provenance are preserved.
get_permissible_value:
  title: Permissible value details
  group: cadsr
  inputs: (permissibleValueId, registryRelease?)
  patterns: {permissibleValueId: *registry_id}
  returns: permissible_value
  items: ["."]
  summary: >-
    A permissible value by the identifier caDSR REST publishes for it; capability_unavailable
    until the platform retrieves a value by it (OP-C10).
get_code_map:
  title: Commons value bindings
  group: cadsr
  inputs: (sourceSystem?, targetContext?, dataElementId?, limit?, cursor?, registryRelease?)
  patterns: {dataElementId: *registry_id}
  returns: "{ codeMaps[code_map], nextCursor? }"
  items: ["codeMaps[]"]
  values: {sourceSystem: [CRDC]}
  bounds: {limit: {default: 100, maximum: 1000}}
  defaults: {sourceSystem: CRDC}
  summary: >-
    Code maps between source code systems and registered value sets, one per data element of
    the CRDC crosswalk with the contexts and commons that use it; targetContext selects those
    a context or commons uses, dataElementId one data element.
list_contexts:
  title: Registry contexts
  group: cadsr
  inputs: (limit?, cursor?, registryRelease?)
  returns: "{ contexts[context], nextCursor? }"
  items: ["contexts[]"]
  bounds: {limit: {default: 100, maximum: 1000}}
  summary: The registry's contexts, by name.
list_classification_schemes:
  title: Classification schemes
  group: cadsr
  inputs: (context?, limit?, cursor?, registryRelease?)
  returns: "{ classificationSchemes[classification_scheme], nextCursor? }"
  items: ["classificationSchemes[]"]
  bounds: {limit: {default: 100, maximum: 1000}}
  summary: >-
    Classification schemes as objects with their nested items; capability_unavailable until the
    platform lists them (OP-C13). A data element's schemes come with get_data_element.

find_data_elements_for_concept:
  title: Data elements for a concept
  group: cross-domain
  inputs: (conceptCode, terminology?, release?, expandDescendants?, includePermissibleValues?, limit?, cursor?)
  patterns: {release: *release, conceptCode: *ncit_code}
  returns: "{ dataElements[data_element_use], permissibleValues[value_use]?, truncation, nextCursor? }"
  items: ["dataElements[]", "permissibleValues[]"]
  values: {terminology: [ncit]}
  defaults: {terminology: ncit, expandDescendants: false, includePermissibleValues: false}
  bounds: {limit: {default: 100, maximum: 1000}}
  summary: >-
    The data elements that use a concept, as an object class, property or permissible value
    concept, optionally across its descendants; with includePermissibleValues, also the
    permissible values whose value meaning stands for it (the reverse lookup, OP-S04).
    Graph associations identify public IDs only, never CDE versions or value-to-version
    assignments, because Shared SI merges versions. caDSR API item versions remain unchanged.
    Each use names all graph roles and actual matching concept codes, with optional integer
    displayOrder; the graph gives no primary flag, so use get_data_element for caDSR's primary
    indicator.
    Representation-term use is not covered by this route, so absence does not establish non-use.
    Only descendant expansion compares the effective release (X-22) with the Shared SI NCIt
    graph's: release_mismatch on a difference, release_not_available for an absent version.
    Exact-code queries preserve both actual graph identities and dates, including an optional
    version only when supplied, without requiring hierarchy alignment.
get_concept_for_permissible_value:
  title: Concept for a permissible value
  group: cross-domain
  inputs: "(permissibleValueId | { dataElementId, value }, release?, version?)"
  patterns: {release: *release, version: *registry_version, dataElementId: *registry_id, permissibleValueId: *registry_id}
  returns: "concept with permissibleValue { dataElement { publicId, version }, value }, or unresolved_pv_concept"
  items: ["."]
  summary: >-
    The concept a permissible value stands for, named by its data element and value, as the
    concept record of the release pinned, its provenance naming both content states (release
    and registry); the caller may name a release or use implicit NCIt resolution (X-22). The
    data element is read from the caDSR API at version, or the API's latest when omitted;
    version uses the existing numeric item-version form and comparison, preserving upstream
    spelling. Only exact NCI_CONCEPT_CODE with a standalone NCIt code resolves through EVS.
    Otherwise returns unresolved_pv_concept with the exact caDSR code/source and caDSR-only
    provenance; compound_code, missing_source and non_ncit_source apply in that precedence.
    Unresolved results make no NCIt concept request but may perform release discovery;
    release selection and both child permissions remain unchanged.
    Only primaryIndicator Yes identifies the value meaning's primary concept;
    missing, invalid or conflicting evidence is upstream_unavailable, identical primary
    assertions of the same code and source presence/value may collapse. Neither array order,
    display order nor graph main/minor decides. Resolved provenance includes the caDSR read
    under upstream.cadsr and the pinned EVS origin, with
    registry state but no Shared SI graphs or graph reads. Secured callers need get_data_element
    and get_concept child permissions before any reads; expiry after caDSR blocks EVS.
    The value is compared locally with the API's permissible
    values by exact, case-sensitive equality (no trimming, no case-folding), never sent upstream
    (A7.7); a value it does not have is not_found. By permissibleValueId, capability_unavailable
    until the platform retrieves a value by it (OP-C10).
resolve_stored_value:
  title: Stored values in a commons
  group: cross-domain
  inputs: (conceptCode, commons, release?, dataElementId?)
  patterns: {release: *release, conceptCode: *ncit_code, dataElementId: *registry_id}
  returns: "{ storedValues[stored_value], confidence, evidence }"
  items: ["storedValues[]"]
  summary: >-
    The literal a data commons stores for a concept of the release given: for GDC through the
    EVS mapset NCIt_Maps_To_GDC, served unpinned, so the release the mapset reports is compared
    with the one asked for (release_mismatch on a difference); for the other commons through
    the CRDC crosswalk, which names the registry state. confidence is asserted
    when a published source names the value and none otherwise; evidence names each source
    consulted ({ mapset, version } or { crosswalk, dataElement }), whether the commons binds
    values to concepts (valueLevelBinding), and its coverage: the number of stored values
    found. A commons without a value-level binding (PDC, IDC) returns no stored value with
    evidence saying so, never the preferred term as if stored.
get_release_alignment:
  title: Terminology and registry alignment
  group: cross-domain
  inputs: (maxIntervalDays?)
  returns: "{ datasets[dataset_release], intervalDays, warning? }"
  items: ["datasets[]"]
  defaults: {maxIntervalDays: 31}
  summary: >-
    The release of every dataset a cross-domain answer rests on (NCIt, the Shared SI NCIt and
    caDSR graphs, the caDSR export), each date ISO-8601; intervalDays, the largest interval in
    days between any two of their dates; and a warning naming maxIntervalDays when
    intervalDays exceeds it.

ground_value:
  title: Cross-registry value grounding
  group: workflow
  inputs: (conceptCode | text, commons?, release?, registryRelease?)
  patterns: {release: *release, conceptCode: *ncit_code}
  free_text: [text]
  returns: "{ concept, dataElements[data_element_use], permissibleValues[value_use], storedValues[stored_value]?, provenance, truncation }"
  items: ["concept", "dataElements[]", "permissibleValues[]", "storedValues[]"]
  summary: >-
    For a concept: the data elements that use it, the permissible values that stand for it,
    and, with commons, the stored values a commons uses for it, each asked by the concept, under
    one provenance envelope naming both content states (release and registry).
    Its Shared SI hops are exact-code queries: graph hierarchy lag or an absent optional version
    does not refuse them; both actual graph identities remain required. EVS content stays pinned.
    Data element uses name all graph roles and actual matching concept codes, with optional
    integer displayOrder; the graph gives no primary flag, so use get_data_element for caDSR's
    primary indicator.
    Representation-term use is not covered by this route, so absence does not establish non-use.
    Without commons
    there is no storedValues. A text is resolved as search_concepts resolves it with its
    defaults (lexical, limit 10), to its first result, the concept chosen named in the result. Without registryRelease the registry is unpinned, as for
    every caDSR tool (X-21). A hop holds at most find_data_elements_for_concept's maximum
    (1,000), its bound `results`; each hop's truncation is carried (perHop), and since each hop
    is asked by the concept, one hop's bound limits no other.
expand_cohort:
  title: Cohort concept expansion
  group: workflow
  inputs: (conceptCode, release?, maxDepth?, includeNegative?, maxNodes?)
  patterns: {release: *release, conceptCode: *ncit_code}
  returns: "{ codes[], excluded[excluded_code], edges[edge], truncation, provenance }"
  items: ["edges[]", "excluded[]"]
  traversal: true
  defaults: {includeNegative: false}
  bounds:
    maxDepth: {default: 2, maximum: 4}
    maxNodes: {default: 200, maximum: 1000}
  summary: >-
    The codes a cohort query should use: the concept itself and its descendants to maxDepth.
    A code an exclusion role of the concept asked about asserts is withheld from codes and
    listed in excluded with its assertion, unless includeNegative keeps it in codes (still
    listed), one excluded record per exclusion assertion; a descendant's own exclusion roles are
    its own, not the cohort's. maxNodes counts the codes, the concept included. The result equals
    composing get_concept_hierarchy (child, depth maxDepth) and get_concept_neighborhood
    (depth 1).
harmonize_data_dictionary:
  title: Data dictionary harmonization
  group: workflow
  inputs: "(columns[{ name, description?, sampleValues[]? }], registryRelease?, filters?)"
  free_text: ["columns[].name", "columns[].description", "columns[].sampleValues[]"]
  returns: "{ columns[{ name, matches[data_element_match], permissibleValueAlignment[value_meaning_match] }], unmatched[], provenance }"
  items: ["columns[].matches[].dataElement"]
  computed: true
  lists: {columns: 10}
  summary: >-
    A data dictionary's columns matched to data elements, one match call per column (its name
    as the entity, its description as entityUserTip), and each column's sample values aligned to
    value meanings (vmMatch); unmatched names the columns without a match; every match names
    one registry state.
