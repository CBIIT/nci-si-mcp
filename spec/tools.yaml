# The required MCP tools: for each, its group, its inputs and result (a trailing ? marks an
# optional argument, | alternatives), the values an enumerated argument takes, and what it
# does. Groups: evs, cadsr, cross-domain and workflow. The conventions of
# conventions.yaml apply to every tool; requirements.yaml says what the suite tests of each.
#
# `items` says where a result's items are, each carrying its provenance (A4.4): "." is the
# result itself, `nodes[]` each element of the result's `nodes`, and `results[].concept` the
# concept of each element of its `results`. A tool with items is content-returning, and the
# cross-cutting requirements apply to it. `traversal: true` marks a tool whose items are
# reached by traversal (A4.2).
#
# `bounds` gives the default and the maximum of each argument that bounds a result (A5.1,
# A5.2). A value above the maximum is applied as the maximum; where content was dropped, the
# truncation record's limit is the value applied. So the input schema states no maximum that
# would refuse such a value: the argument's description states its default and maximum. A value
# below 1 is an invalid request, never raised to 1. An argument without a default has none
# by design: the tool's summary says what it does when the argument is not given.

resolve_release:
  group: evs
  inputs: (terminology, channel?)
  returns: "{ terminology, channel, version, date, alternatives[] }"
  items: ["."]
  summary: Which release of a terminology is current, by channel (without one, the channel configured, A3.6.2); called explicitly, and its answer is passed to every later call.
get_concept:
  group: evs
  inputs: (terminology, release, code, include[]?)
  returns: concept
  items: ["."]
  values: {include: [synonyms, definitions, properties, semanticType]}
  summary: One concept with the detail selected.
get_concepts:
  group: evs
  inputs: (terminology, release, codes[], include[]?)
  returns: "{ concepts[], missing[] }"
  items: ["concepts[]"]
  values: {include: [synonyms, definitions, properties, semanticType]}
  summary: Many concepts in one platform call, with the detail selected.
search_concepts:
  group: evs
  inputs: (terminology, release, query, mode?, limit?, cursor?, retired?)
  returns: "{ results[{ concept, score?, matchedOn? }], nextCursor?, totalKnown? }"
  items: ["results[].concept"]
  values: {mode: [lexical, typeahead, semantic, hybrid], retired: [include, only]}
  summary: >-
    Ranked search of a terminology; semantic and hybrid from the interim NCIt index (M4.1).
    Retired concepts are returned with the others (retired include, the default, as the
    platform returns them), or alone (retired only, the status the terminology's listing
    names as retired); every mode takes the same two values. Search cannot leave retired
    concepts out: the platform offers no such selection, and each result's active and status
    let a caller drop them itself.
get_concept_hierarchy:
  group: evs
  inputs: (terminology, release, code, direction, depth?, limit?, cursor?)
  returns: "{ nodes[], paths[]?, truncation, nextCursor? }"
  items: ["nodes[]"]
  traversal: true
  values: {direction: [parent, child, pathsToRoot]}
  bounds: {depth: {default: 1, maximum: 4}, limit: {default: 200, maximum: 1000}}
  summary: >-
    A concept's parents, children or paths to the root, bounded. nodes holds the concepts
    reached, not the one asked about, and limit is a page that the cursor continues.
    pathsToRoot returns each path the platform gives in paths, the codes from the concept to
    the root in the platform's order, with each concept on them once in nodes; depth, limit
    and cursor do not apply to it.
expand_value_set:
  group: evs
  inputs: (terminology, release, valueSet | code, count?, offset?, activeOnly?)
  returns: "{ members[], total, truncation }"
  items: ["members[]"]
  summary: >-
    The members of a value set, paged and bounded by the tool itself; $lookup, $validate-code,
    $subsumes and $translate where a caller asks. It pages by count and offset, as FHIR $expand
    does, in place of a cursor (the exception to M6.1); activeOnly is false unless given.
get_concept_neighborhood:
  group: evs
  inputs: (terminology, release, code, depth?, kinds[]?, maxNodes?, maxEdges?, budgetPerKind?, includeNegative?)
  returns: "{ nodes[], edges[], truncation }"
  items: ["nodes[]", "edges[]"]
  traversal: true
  values: {kinds: [parent, child, role, association, inverseRole, inverseAssociation]}
  bounds:
    depth: {default: 2, maximum: 4}
    maxNodes: {default: 200, maximum: 1000}
    maxEdges: {default: 1000, maximum: 5000}
    budgetPerKind: {maximum: 1000}
  summary: >-
    Bounded traversal across roles and associations with a budget per kind; nodes holds the
    concept asked about at depth 0 and those reached, and maxNodes counts them all. Given,
    budgetPerKind bounds the nodes each kind adds; not given, the tool shares maxNodes among
    the kinds asked so that none present is starved, in a way of its own. Negative assertions
    are returned marked, with the nodes they reach, which are not followed further unless
    includeNegative.
get_concept_subsets:
  group: evs
  inputs: (terminology, release, code)
  returns: "{ subsets[] }"
  items: ["subsets[]"]
  summary: The subsets a concept belongs to.
get_concept_mappings:
  group: evs
  inputs: (terminology, release, code, targetTerminology?)
  returns: "{ mappings[] }"
  items: ["mappings[]"]
  summary: >-
    The maps the platform carries on a concept, from it to other terminologies, unchanged and
    each with its target's version where the platform gives one; maps into the terminology
    from others are not this tool's. targetTerminology keeps the maps whose target the
    platform names exactly so, case included.
resolve_retired_code:
  group: evs
  inputs: (terminology, release, code)
  returns: "{ code, terminology, active, status?, replacements[] }"
  items: [".", "replacements[]"]
  summary: >-
    Whether a code is retired (active false, as the platform publishes it), its status, and
    what the platform names as replacing it: replacements is an empty list, present, where the
    platform names none, retired or not.
list_relationships:
  group: evs
  inputs: (terminology, release)
  returns: "{ relationships[] }"
  items: ["relationships[]"]
  summary: The relationship catalogue of a release, polarity marked by code.
list_terminologies:
  group: evs
  inputs: ()
  returns: "{ terminologies[] }"
  items: ["terminologies[]"]
  summary: The terminologies available, with their current releases.

resolve_registry_release:
  group: cadsr
  inputs: ()
  returns: "{ identifier, generatedAt, sourceDistribution }"
  summary: The registry's content state; no identifier is invented where caDSR publishes none.
get_data_element:
  group: cadsr
  inputs: (publicId | longName | questionText, version?, include[]?)
  returns: dataElement
  values: {include: [permissibleValues, valueDomain, conceptAssociations, alternateNames, provenance]}
  summary: One data element with the detail selected.
search_data_elements:
  group: cadsr
  inputs: (query, mode?, filters?, limit?, cursor?)
  returns: "{ results[{ dataElement, score?, matchedOn? }], nextCursor?, totalKnown? }"
  values: {mode: [lexical, semantic, hybrid], filters: [context, workflowStatus, registrationStatus, valueDomainType]}
  summary: Search of data elements, filtered by context, status and value-domain type.
match_data_elements:
  group: cadsr
  inputs: "(entities[{ name, userTip?, permissibleValues[]? }], matchLimit?, modelVariant?, similarityThreshold?, filters?, cursor?)"
  returns: "{ matches[{ dataElement, score, rule, matchedText }], nextCursor? }"
  summary: Data elements matched to described entities, keyword and AI-enhanced, scored.
match_value_meanings:
  group: cadsr
  inputs: (values[], strictness?, terminologyScope?, cursor?)
  returns: "{ matches[{ valueMeaning, score, crosswalk[] }], nextCursor? }"
  summary: Value meanings matched to values, with crosswalk codes.
get_form:
  group: cadsr
  inputs: (publicId? | keyword?, version?, includeModules?)
  returns: form
  summary: A form or case report form with its modules and questions.
get_permissible_value:
  group: cadsr
  inputs: (permissibleValueId)
  returns: permissibleValue
  summary: A permissible value by its identifier.
get_code_map:
  group: cadsr
  inputs: (sourceSystem?, targetContext?, dataElementId?, cursor?)
  returns: "{ codeMaps[], nextCursor? }"
  summary: Code maps between source code systems and registered value sets, the CRDC crosswalk included.
list_contexts:
  group: cadsr
  inputs: (cursor?)
  returns: "{ contexts[], nextCursor? }"
  summary: The registry's contexts.
list_classification_schemes:
  group: cadsr
  inputs: (context?, cursor?)
  returns: "{ classificationSchemes[], nextCursor? }"
  summary: Classification schemes as objects with their nested items.

find_data_elements_for_concept:
  group: cross-domain
  inputs: (conceptCode, terminology?, release?, expandDescendants?, includePermissibleValues?, limit?, cursor?)
  returns: "{ dataElements[], truncation, nextCursor? }"
  summary: The data elements and permissible values that use a concept, optionally across its descendants.
get_concept_for_permissible_value:
  group: cross-domain
  inputs: "(permissibleValueId | { dataElementId, value })"
  returns: concept
  summary: The concept a permissible value stands for.
resolve_stored_value:
  group: cross-domain
  inputs: (conceptCode, commons, dataElementId?)
  returns: "{ storedValues[], confidence, evidence }"
  summary: The literal a data commons stores for a concept.
get_release_alignment:
  group: cross-domain
  inputs: ()
  returns: "{ datasets[{ name, version, date }], maxIntervalDays, warning? }"
  summary: The release of every dataset a cross-domain answer touches, and the interval between them.

ground_value:
  group: workflow
  inputs: (conceptCode | text, commons?, release, registryRelease)
  returns: "{ concept, dataElements[], permissibleValues[], storedValues[], provenance, truncation }"
  summary: Concept to data element to permissible value to stored value, under one provenance envelope naming both content states.
expand_cohort:
  group: workflow
  inputs: (conceptCode, release, maxDepth?, includeNegative?, maxNodes?)
  returns: "{ codes[], excluded[], edges[], truncation, provenance }"
  summary: The codes a cohort query should use, exclusion assertions withheld and listed.
harmonize_data_dictionary:
  group: workflow
  inputs: "(columns[{ name, description?, sampleValues[]? }], registryRelease, filters?)"
  returns: "{ columns[{ matches[{ dataElement, score, rule }], permissibleValueAlignment }], unmatched[], provenance }"
  summary: A data dictionary's columns matched to data elements, with permissible-value alignment.
