[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "nci-si-mcp"
dynamic = ["version"]
description = "EVS-first NCI Semantic Infrastructure MCP server prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
server = [
    "mcp>=2.0,<3",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
nci-si-mcp = "nci_si_mcp.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "mypy>=1.8.0",
    "ruff>=0.5.0",
]

[tool.pdm]
distribution = true

# `pdm install` and `pdm sync` always include the server extra, which the server
# tests need, and never the embeddings extra unless it is named. `pdm lock`
# covers every group.
[tool.pdm.options]
install = ["-G", "server"]
sync = ["-G", "server"]
lock = ["-G", ":all"]

# The version is the nearest `vX.Y.Z` tag, or a development version after it.
# A clone without tags gets `0.1.devN`, and a source tree without git metadata
# gets the fallback.
[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[tool.pdm.scripts]
# `test` is the whole suite with the coverage floor; `pytest` runs a selection without it.
test = "pytest --cov=nci_si_mcp --cov-report=term-missing"
pytest = "pytest"
lint = { composite = ["ruff check src tests", "mypy"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["nci_si_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src/nci_si_mcp"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
