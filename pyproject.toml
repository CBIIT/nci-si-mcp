[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "nci-si-mcp"
dynamic = ["version"]
description = "EVS-first NCI Semantic Infrastructure MCP server prototype"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
server = [
    "mcp>=2.0,<3",
]
index = [
    "numpy>=2.5,<3",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
nci-si-mcp = "nci_si_mcp.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]
# Ruff and basedpyright are pinned exactly, so that `pdm update` does not move them:
# a new release can add findings.
lint = [
    "ruff==0.16.10",
    "basedpyright==1.40.1",
    "pre-commit>=4.0",
    "radon>=6.0",
    "vulture>=2.16",
]
# Known vulnerabilities in the runtime dependencies, in CI (.github/workflows/audit.yml).
audit = [
    "pip-audit>=2.9",
]
docs = [
    "zensical==0.0.68",
]

[tool.pdm]
distribution = true

# The acceptance suite is a package of its own, installed editable beside the server.
# An editable path is a PDM extension that standard dependency groups do not allow.
[tool.pdm.dev-dependencies]
acceptance = [
    "-e file:///${PROJECT_ROOT}/acceptance#egg=nci-si-acceptance",
]

# `pdm install` and `pdm sync` include the server and index extras used by the
# offline tests, but never the embeddings extra unless it is named. `pdm lock`
# covers every group.
[tool.pdm.options]
install = ["-G", "server", "-G", "index"]
sync = ["-G", "server", "-G", "index"]
lock = ["-G", ":all"]

# The version is the nearest `vX.Y.Z` tag, or a development version after it.
# A clone without tags gets `0.1.devN`, and a source tree without git metadata
# gets the fallback.
[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

# The release workflow computes the next version from the commit subjects on main
# since the last tag, which are pull request titles (CONTRIBUTING.md). Below 1.0 a
# breaking change releases a minor version; 1.0.0 is tagged by hand.
[tool.semantic_release]
tag_format = "v{version}"  # the form the version source above reads
allow_zero_version = true
major_on_zero = false

# `allowed_tags` are the types a commit subject may have; only `minor_tags` and
# `patch_tags` release a version. `allowed_tags` is stated in full because the
# parser reads no other list of types. The title check in
# .github/workflows/pr-title.yml accepts exactly these types.
[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
allowed_tags = [
    "feat", "fix", "perf",
    "docs", "style", "refactor", "test",
    "chore", "build", "ci", "revert", "security", "deprecate",
]
# The defaults, stated because the scheme depends on them: a squash commit is read
# line by line, and its body is empty (a repository setting), so only the title counts.
ignore_merge_commits = true
parse_squash_commits = true

[tool.pdm.scripts]
# `test` is the whole suite with the coverage minimum; `pytest` runs a selection without it.
test = "pytest --cov --cov-report=term-missing"
pytest = "pytest"
# The fast check before a commit; the commit itself runs every hook.
lint = { composite = ["ruff check .", "basedpyright"] }
fmt = "ruff format ."
# The acceptance suite against the server (fixture mode unless NCI_SI_ACCEPTANCE_MODE says
# otherwise), and the harness's own tests with its coverage minimum.
acceptance = { cmd = "pytest", working_dir = "acceptance" }
# Four workers: the self-tests wait on server processes, and four overlap those waits on the
# two-CPU CI runners; more measured no faster.
acceptance-selftest = { cmd = "pytest selftests -n 4 --dist worksteal --cov --cov-report=term-missing", working_dir = "acceptance" }
acceptance-http = "python scripts/acceptance_http.py"
acceptance-record = "python -m nci_si_acceptance.record"
acceptance-craft = "python -m nci_si_acceptance.craft"
acceptance-expected = "python -m nci_si_acceptance.expected"
acceptance-status = "python -m nci_si_acceptance.status"
acceptance-register = "python -m nci_si_acceptance.register"
acceptance-stories = "python -m nci_si_acceptance.stories"
acceptance-index-codes = "python -m nci_si_acceptance.suite"
spec-render = "python -m nci_si_acceptance.document"
docs-build = "python -m scripts.docs_site"
portal = "python -m scripts.portal"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate scripts are imported by their tests.
pythonpath = ["tests", "scripts/validation"]

[tool.coverage.run]
branch = true
source = [
    "nci_si_mcp",
    "scripts.evidence_envelope",
    "scripts.evidence_acceptance",
    "scripts.evidence_benchmark",
    "scripts.docs_site",
    "scripts.docs_links",
    "scripts.portal",
    "scripts.portal_store",
    "scripts.portal_views",
    "scripts.portal_http",
    "scripts.portal_help",
]
# CLI and transport tests launch Python children; include their executed code.
patch = ["subprocess"]

# The checked minimum; standard 3 in CONTRIBUTING.md gives the aim and the reason for the gap.
[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts", "acceptance/src"]

[tool.ruff.lint]
select = [
    "F", "E", "W",  # pyflakes and pycodestyle
    "BLE",          # a broad except that neither passes the exception on nor logs the traceback
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "C4",           # flake8-comprehensions
    "RUF",          # ruff-specific
    "S",            # flake8-bandit (security)
    "ASYNC",        # flake8-async
    "TCH",          # flake8-type-checking, without the three import rules ignored below
    "PL",           # pylint
    "T20",          # print: over stdio, stdout belongs to the MCP protocol
]
ignore = [
    # An MCP tool takes one parameter per argument, and so do the service and
    # traversal functions behind it.
    "PLR0913", "PLR0917",
    # An import that only annotations use stays an ordinary import. The MCP SDK
    # resolves the tool annotations at run time, and elsewhere a TYPE_CHECKING
    # block would be ceremony without a gain.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Optional extras (mcp, sentence-transformers) are imported where they are first needed.
"src/nci_si_mcp/embeddings.py" = ["PLC0415"]
"src/nci_si_mcp/server.py" = ["PLC0415"]
"src/nci_si_mcp/transport.py" = ["PLC0415"]
"src/nci_si_mcp/index_scoring.py" = ["PLC0415"]
# The gate scripts report on the terminal.
"scripts/**/*.py" = ["T20"]
# The acceptance suite is written in pytest's style, which asserts with `assert`.
"acceptance/{tests,selftests}/**/*.py" = ["S101"]

# Dead code. The names listed are used in ways vulture cannot see: the MCP SDK
# calls the decorated tools and resources, pytest its fixtures and hooks, http.server
# the handler methods, socketserver `handle`, the SDK `verify_token`, HTMLParser its callbacks,
# sqlite3 reads `row_factory`, and the dataclass fields named
# here are only ever serialized. Pydantic reads the wire-record annotations to build
# schemas, and the MCP SDK reads the tool functions' resolved __annotations__.
[tool.vulture]
paths = ["src", "tests", "scripts", "acceptance"]
min_confidence = 60
ignore_decorators = ["@mcp.tool", "@tool", "@mcp.resource", "@resource", "@pytest.fixture"]
ignore_names = [
    # Principal equality binds the tenant too; dataclasses reads this field implicitly.
    "tenant",
    "row_factory", "built_at", "index_path", "state",
    "evaluation_version", "evaluation_score", "synonyms", "matchedOn", "totalKnown", "builtAt",
    "correlationId", "servedBy", "retrievedAt", "sourceUri", "perKind", "nextCursor",
    "semanticType", "sourceCode", "sourceTerminology", "targetCode", "targetTerminology",
    "targetName", "targetTermType", "targetTerminologyVersion",
    "active_index_compatible", "evs_api", "selected_release", "active_index",
    "__annotations__",
    "pytest_*", "do_*", "log_message", "close_connection",
    "handle", "verify_token",
    "handle_starttag", "handle_endtag", "handle_data",
    "handle_entityref", "handle_charref", "handle_comment", "handle_decl",
    "registry", "generatedAt", "sourceDistribution", "conceptCode", "valueMeaning",
    "workflowStatus", "registrationStatus", "dateCreated", "dateModified", "permissibleValues",
    "valueDomain", "conceptAssociations", "alternateNames", "classificationSchemes", "dataElement",
    "userTip", "valueDomainType", "classificationScheme", "matchedText", "itemType", "evsSource",
    "crdcName", "usedBy", "valueLevelBinding", "coverage", "codeMaps",
    "conceptTerminology", "dataElements", "permissibleValue", "storedValues", "confidence",
    "intervalDays",
    "perHop", "permissibleValueAlignment", "sampleValues",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# The tests (and the acceptance suite's tests) are left out. They pass wrong types on
# purpose, and they are not written to type-check: fakes that are not subclasses,
# results used without narrowing.
include = ["src", "scripts", "acceptance/src"]
reportMissingImports = true
