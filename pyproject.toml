[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "nci-si-mcp"
dynamic = ["version"]
description = "EVS-first NCI Semantic Infrastructure MCP server prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
server = [
    "mcp>=2.0,<3",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
nci-si-mcp = "nci_si_mcp.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Ruff and basedpyright are pinned exactly, so that `pdm update` does not move them:
# a new release can add findings.
lint = [
    "ruff==0.16.10",
    "basedpyright==1.40.1",
    "pre-commit>=4.0",
    "radon>=6.0",
    "vulture>=2.16",
]

[tool.pdm]
distribution = true

# `pdm install` and `pdm sync` always include the server extra, which the server
# tests need, and never the embeddings extra unless it is named. `pdm lock`
# covers every group.
[tool.pdm.options]
install = ["-G", "server"]
sync = ["-G", "server"]
lock = ["-G", ":all"]

# The version is the nearest `vX.Y.Z` tag, or a development version after it.
# A clone without tags gets `0.1.devN`, and a source tree without git metadata
# gets the fallback.
[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[tool.pdm.scripts]
# `test` is the whole suite with the coverage minimum; `pytest` runs a selection without it.
test = "pytest --cov=nci_si_mcp --cov-report=term-missing"
pytest = "pytest"
# The fast check before a commit; the commit itself runs every hook.
lint = { composite = ["ruff check .", "basedpyright"] }
fmt = "ruff format ."

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate scripts are imported by their tests.
pythonpath = ["tests", "scripts/validation"]

[tool.coverage.run]
branch = true
source = ["nci_si_mcp"]

# The checked minimum; standard 3 in CONTRIBUTING.md gives the aim and the reason for the gap.
[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "F", "E", "W",  # pyflakes and pycodestyle
    "BLE",          # a broad except that neither passes the exception on nor logs the traceback
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "C4",           # flake8-comprehensions
    "RUF",          # ruff-specific
    "S",            # flake8-bandit (security)
    "ASYNC",        # flake8-async
    "TCH",          # TYPE_CHECKING blocks and quoted casts; the import rules are ignored below
    "PL",           # pylint
    "T20",          # print: over stdio, stdout belongs to the MCP protocol
]
ignore = [
    # An MCP tool takes one parameter per argument, and so do the service and
    # traversal functions behind it.
    "PLR0913", "PLR0917",
    # An import that only annotations use stays an ordinary import. The MCP SDK
    # resolves the tool annotations at run time, and elsewhere a TYPE_CHECKING
    # block would be ceremony without a gain.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
# A helper assertion is named like unittest's own: assertError.
"tests/**/*.py" = ["N802"]
# Optional extras (mcp, sentence-transformers) are imported where they are first needed.
"src/nci_si_mcp/embeddings.py" = ["PLC0415"]
"src/nci_si_mcp/server.py" = ["PLC0415"]
# The gate scripts report on the terminal.
"scripts/**/*.py" = ["T20"]

# Dead code. The names listed are used in ways vulture cannot see: the MCP SDK
# calls the decorated tools and resources, sqlite3 reads `row_factory`, and the
# dataclass fields named here are only ever serialized.
[tool.vulture]
paths = ["src", "tests", "scripts"]
min_confidence = 60
ignore_decorators = ["@mcp.tool", "@mcp.resource"]
ignore_names = ["row_factory", "built_at", "index_path", "state", "reuse_targets"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# The tests are left out. They pass wrong types on purpose, and they are not written
# to type-check: fakes that are not subclasses, results used without narrowing.
include = ["src", "scripts"]
reportMissingImports = true
