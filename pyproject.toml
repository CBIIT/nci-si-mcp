[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nci-si-mcp"
version = "0.1.0"
description = "EVS-first NCI Semantic Infrastructure MCP server prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
]

[project.optional-dependencies]
server = [
  "mcp>=2.0,<3; python_version >= '3.10'",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]
test = [
  "pytest>=7.0.0",
  "pytest-cov>=4.1.0",
]
dev = [
  "mypy>=1.8.0",
  "ruff>=0.5.0",
]

[project.scripts]
nci-si-mcp = "nci_si_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=nci_si_mcp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["nci_si_mcp"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/nci_si_mcp"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
