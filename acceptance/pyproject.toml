[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

# The suite's version is the repository's nearest `vX.Y.Z` tag, as the server's is, so a
# report names the tag of the suite it ran (docs/specification.md §5). The fixture set is
# versioned apart, by its pin and recording dates.
[project]
name = "nci-si-acceptance"
dynamic = ["version"]
description = "Behavioural acceptance suite and upstream fixture server for the NCI SI MCP tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.18",
    "mcp>=2.0,<3",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mcp_session: use a handshake session for remote session-retention assertions",
    "tool(name): the required tool the test is for, in the per-tool report",
    "requirement(*ids): the requirements of spec/requirements.yaml the test enforces",
    "gate: a protocol-level gate (a P requirement); a failure fails every tool",
    "scenario(*names): the scenarios active for the test, on a server process of its own",
    "own_server: the test runs on a server process of its own, with nothing cached from others",
    "live_capable: also runs in live mode",
    "unmatched_upstream: expects upstream requests without a fixture, and checks them itself",
    "prepared: needs what the operator's prepare command produced; NOT RUN without it",
    "unprepared: runs on a server of its own started without what the prepare command produced",
]

[tool.coverage.run]
branch = true
source = ["nci_si_acceptance"]
# Renderer and report CLI tests execute in child interpreters.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
