# The baseline tool map (docs/implementation-plan.md §9.4): the prototype tools that stand in for required
# tools while the server lacks them, and how their arguments translate (tools.py). An entry
# applies only while its required tool is absent; the mechanism goes in the change that
# removes the last entry (owner decision, 2 October 2026).
#
# The prototype serves NCIt's current monthly release only: `terminology` is checked to be
# ncit and `release` is accepted, neither passed on. An argument the entry does not list, and
# an argument or value mapped to null, is a capability the prototype lacks: NOT IMPLEMENTED.
#
# search_concepts has no stand-in: the prototype cannot search EVS (lexical, typeahead), and
# its index search needs an index the suite does not build before the operator's prepare
# step exists.

resolve_release:
  tool: ncit_release_info
  arguments:
    terminology: &ncit {values: {ncit: ncit, "*": null}}
    channel: {values: {weekly: null}}   # the prototype resolves the monthly release only

get_concept:
  tool: ncit_lookup
  arguments:
    terminology: *ncit
    release: &accepted {}
    code: code
    include: null                       # no projection: the prototype returns one shape

get_concept_hierarchy:
  tool: ncit_traverse
  fixed: {direction: both}              # the edge type alone then selects parent or child
  arguments:
    terminology: *ncit
    release: *accepted
    code: {name: start_codes, list: true}
    direction: {name: edge_types, list: true, values: {parent: parent, child: child, pathsToRoot: null}}
    depth: max_depth
    limit: null                         # a page; the prototype's max_nodes is a bound
    cursor: null

get_concept_neighborhood:
  tool: ncit_traverse
  fixed: {direction: both}
  arguments:
    terminology: *ncit
    release: *accepted
    code: {name: start_codes, list: true}
    depth: max_depth
    kinds:
      name: edge_types
      values: {inverseRole: inverse_role, inverseAssociation: inverse_association}
    maxNodes: max_nodes
    maxEdges: max_edges
    budgetPerKind: budget_per_kind
    # No polarity: negative edges are neither marked nor withheld, so only the default
    # (false) can be served.
    includeNegative: {values: {true: null}}
