    - {<<: *unknown, fixture: scenarios/release/unknown/association-catalogue.json, path: /api/v1/metadata/ncit_99.99z/associations}
    - {<<: *unknown, fixture: scenarios/release/unknown/replacement.json, path: /api/v1/history/ncit_99.99z/C154421/replacements}
    - {<<: *unknown, fixture: scenarios/release/unknown/replacements.json, path: "/api/v1/history/ncit_99.99z/replacements?list=C154421"}
