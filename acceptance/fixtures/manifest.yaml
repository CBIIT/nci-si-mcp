      surface: evs
      path: /api/v1/history/ncit_26.09d/replacements?list=C4817
    # Subsets: the GDC Value Terminology, unpinned (the pinned form is crafted under
    # `derived`) and the first page of its members.
    - fixture: recorded/evs/subset-gdc-unpinned.json
      operation: OP-E06
      rationale: 'The subset by its unpinned path: the pinned path answers 404 today; the payload names its release.'
