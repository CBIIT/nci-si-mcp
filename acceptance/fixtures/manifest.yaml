            GRAPH <http://cbiit.nci.nih.gov/caDSR> {
              VALUES ?role { cadsr:main_concept cadsr:minor_concept }
              ?node ?role ?concept .
              { VALUES ?part { mdr:Object_Class mdr:Property } ?element ?part ?node . }
              UNION
              { ?value cadsr:has_concept ?node . ?element mdr:permitted_value ?value . }
              ?element cadsr:publicId ?id ;
                mdr:version ?version ;
                rdfs:label ?label .
            }
          }
          GROUP BY ?id ?version
          ORDER BY ?id ?version
          LIMIT 1001
    - <<: *sparql
      fixture: recorded/ssis-sparql/values-c2991.json
      operation: OP-S04
      rationale: >-
        The permissible values that stand for Disease or Disorder (C2991), 461 rows: ground_value's value hop, complete while the data element hop is cut.
      form:
        query: |-
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX owl: <http://www.w3.org/2002/07/owl#>
          PREFIX dc: <http://purl.org/dc/elements/1.1/>
          PREFIX mdr: <http://www.iso.org/11179/MDR#>
          PREFIX cadsr: <http://cbiit.nci.nih.gov/caDSR#>
          PREFIX ncit: <http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#>
          SELECT DISTINCT ?id ?version ?value ?concept
          WHERE {
            VALUES ?concept { ncit:C2991 }
            GRAPH <http://cbiit.nci.nih.gov/caDSR> {
              VALUES ?role { cadsr:main_concept cadsr:minor_concept }
              ?node ?role ?concept .
              ?pv cadsr:has_concept ?node ;
                mdr:value ?value .
              ?element mdr:permitted_value ?pv ;
                cadsr:publicId ?id ;
                mdr:version ?version .
            }
          }
          ORDER BY ?id ?version ?value ?concept
          LIMIT 1001
    - <<: *sparql
      fixture: recorded/ssis-sparql/query-refused.json
      rationale: >-
        The inspection layer's refusal of a query it does not pass: HTTP 403 with an HTML
        body. ssis/query-rejected serves it to every query.
      status: 403
      form:
        query: |-
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX owl: <http://www.w3.org/2002/07/owl#>
          PREFIX dc: <http://purl.org/dc/elements/1.1/>
          PREFIX mdr: <http://www.iso.org/11179/MDR#>
          PREFIX cadsr: <http://cbiit.nci.nih.gov/caDSR#>
          PREFIX ncit: <http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#>
          SELECT ?concept
          WHERE {
            GRAPH <http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.rdf> {
              ?concept rdfs:subClassOf ?parent
                OPTION (TRANSITIVE, t_distinct, t_in(?concept), t_out(?parent), t_max(3)) .
              FILTER (?parent = ncit:C17357)
            }
          }
    - fixture: recorded/ssis-sparql/graph-identities-direct.json
      operation: OP-S01
      rationale: >-
        The identity query as a direct POST (application/sparql-query, SPARQL 1.1 protocol):
        refused with HTTP 403 and an HTML body, so a server that asks this way gets no answer.
      surface: ssis-sparql
      method: POST
      path: /sparql
      status: 403
      headers:
        Accept: application/sparql-results+json
        Content-Type: application/sparql-query
      body: *identity-query

