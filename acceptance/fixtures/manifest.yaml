      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC
    # Its maps (issue #6: the cross-domain tests need them), by a GDC value and by a
    # concept code; `term` matches as a prefix (C4817 also finds C48177).
    - fixture: recorded/evs/mapset-gdc-maps-value.json
