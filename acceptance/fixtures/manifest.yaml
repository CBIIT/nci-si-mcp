# The fixture set: its pin, the concept rules, the scenarios, and what
# `pdm run acceptance-record` records (fixtures/README.md). Re-pinning the release is a
# re-recording under change control (docs/specification.md §4).

evs:
  release: ncit_26.09d
  # The concept rules (concepts.py). The include table was read from EVS on
  # 2 October 2026: each value adds these keys to the base, and `full` is the union
  # of the others; `paths`, `descendants` and `disjointWith` are not in it, so a
  # request for them goes unanswered.
  concepts:
    base: [code, name, terminology, version, conceptStatus, leaf, active]
    default: summary
    include:
      minimal: []
      summary: [synonyms, definitions, properties]
      synonyms: [synonyms]
      definitions: [definitions]
      properties: [properties]
      parents: [parents]
      children: [children]
      roles: [roles]
      inverseRoles: [inverseRoles]
      associations: [associations]
      inverseAssociations: [inverseAssociations]
      maps: [maps]
      history: [history]
      full: [synonyms, definitions, properties, parents, children, roles, inverseRoles,
             associations, inverseAssociations, maps, history]
    # The relation lists answered on their own, /api/v1/concept/{terminology}/{code}/{relation}
    # (operations OP-E10, E11, E14 to E17, E20).
    relations: [parents, children, roles, inverseRoles, associations, inverseAssociations, maps]

# The base URL of each recorded surface; a fixture's path is relative to it.
surfaces:
  evs: https://api-evsrest.nci.nih.gov
  evs-fhir: https://api-evsrest.nci.nih.gov/fhir/r4
  # caDSR's APIs share one host, each under its own path: the data element API
  # (/NCIAPI/1.0/api), lists of values (/NCILovAPI/1.0/api), forms
  # (/NCIFormAPI.v2_0:NciFormApiRad) and the two match services.
  cadsr: https://cadsrapi.cancer.gov/rad
  cadsr-ftp: https://cadsr.nci.nih.gov/ftp/caDSR_Downloads
  # The published contracts of the caDSR APIs, which the crafted credentialed answers follow.
  cadsr-contracts: https://cadsrapi.cancer.gov/invoke
  # The Shared SI Service: its REST façade (/si-api/v1, beside caDSR's APIs) and its SPARQL
  # endpoint (/sparql).
  ssis: https://cadsrapi.cancer.gov
  ssis-sparql: https://shared.semantics.cancer.gov

# What each scenario provokes, in the order the register lists
# them (register.py). Whether a scenario is recorded or crafted is read from its fixtures.
scenarios:
  release/unknown: Every content path of `ncit_99.99z` answers 404
  release/mismatch: >-
    Every payload that reports the pinned release names 26.08e instead, the unpinned forms
    included; release discovery is left as recorded
  release/two-latest: >-
    A weekly and a monthly row are both `latest`, the weekly first in every list; each
    form of the release query gives a channel the same release
  release/duplicate-tag: >-
    Two releases are both latest with the monthly tag; the monthly query and the listing name
    both
  batch/silent-drop: A code EVS does not know is left out of a batch
  retired/with-replacement: C154421 is retired with a replacement, and one bad code fails a batch
  traversal/deep-fanout: >-
    One root has 1,001 children, and a chain runs deeper than depth 4 from its first child,
    C99000001 (the node maximum is reached at depth 1 from the root)
  traversal/exclusions: Exclusion roles are named like positive ones, and two the other way
  traversal/starvation: >-
    One concept has 300 roles and 2 associations, and another 300 associations and 2 roles,
    to the same targets
  valueset/inactive-members: >-
    Two members of value set C85492 are marked inactive (FHIR contains.inactive), in both
    forms of its expansion
  relationships/exclusion-missing: The role catalogue lacks R135, a code of the exclusion set
  upstream/unavailable: >-
    Every upstream request, whatever its surface and path, gets a closed connection, then 503,
    then no answer within the timeout
  upstream/rate-limited: 429 with `Retry-After` on the release query, then the answer
  license/restricted: 403 without the licence key; invented content with it
  license/attributed: >-
    The invented licensed content of license/restricted, each concept carrying the
    terminology's licence text as EVS is asked to send it (#42)
  cadsr/with-registry-release: >-
    caDSR publishes a registry release: /registry/releases names one, and a data element
    asked with it is answered with the release echoed (C-1)
  cadsr/credentialed: >-
    The server holds caDSR credentials: contexts and CDE Match answer to the contracts,
    where the API refuses an anonymous caller (401)
  cadsr/match-timeout: vmMatch answers later than the match timeout the scenario sets
  cadsr/html-for-json: >-
    A data element asked for with Accept: application/json is answered with the HTML caDSR
    sends to a request without it
  upstream/masked-error: >-
    Every request to the Shared SI façade and to the caDSR API is answered with HTTP 200 and an
    apiResponse of type E, the failure each sends inside a success
  ssis/query-rejected: >-
    Every SPARQL query is refused by the Shared SI Service's inspection layer: HTTP 403 with an
    HTML body

record:
  requests:
    # Release resolution: the listing, and the one-row query per channel (SPEC §3.3).
    - fixture: recorded/evs/version.json
      operation: baseline
      rationale: The furnished server's ncit_release_info reads it; no required tool needs it.
      surface: evs
      path: /api/v1/version
    - fixture: recorded/evs/terminologies.json
      operation: OP-E01
      rationale: The listing behind list_terminologies, and what the furnished server filters today.
      surface: evs
      path: /api/v1/metadata/terminologies
    - fixture: recorded/evs/release-monthly.json
      operation: OP-E01
      rationale: 'The one-row release query: latest is channel-scoped, so the channel is given as a tag (E-1).'
      surface: evs
      path: /api/v1/metadata/terminologies?terminology=ncit&latest=true&tag=monthly
    - fixture: recorded/evs/release-weekly.json
      operation: OP-E01
      rationale: The same query for the weekly channel.
      surface: evs
      path: /api/v1/metadata/terminologies?terminology=ncit&latest=true&tag=weekly
    # The relationship catalogue of the pinned release.
    - fixture: recorded/evs/roles.json
      operation: OP-E02
      rationale: The role catalogue of the pinned release, for polarity by code.
      surface: evs
      path: /api/v1/metadata/ncit_26.09d/roles
    - fixture: recorded/evs/associations.json
      operation: OP-E03
      rationale: The association catalogue of the pinned release.
      surface: evs
      path: /api/v1/metadata/ncit_26.09d/associations
    # Search: lexical, typeahead, a page after the first, and a query matching nothing.
    - fixture: recorded/evs/search-contains.json
      operation: OP-E08
      rationale: 'Lexical search: type=contains, minimal concepts with highlights for matchedOn, the page given in full.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=ewing sarcoma&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10
    - fixture: recorded/evs/search-contains-page-2.json
      operation: OP-E08
      rationale: The second page of the same search.
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=ewing sarcoma&type=contains&include=minimal,highlights&fromRecord=10&pageSize=10
    - fixture: recorded/evs/search-starts-with.json
      operation: OP-E08
      rationale: 'Typeahead: type=startsWith.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=ewing&type=startsWith&include=minimal,highlights&fromRecord=0&pageSize=10
    - fixture: recorded/evs/search-retired-default.json
      operation: OP-E08
      rationale: 'Retired concepts in a lexical search: the default returns them with the others, C154421 first.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=Transgender Identity&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10
    - fixture: recorded/evs/search-retired-only.json
      operation: OP-E08
      rationale: 'The same search for retired concepts alone: conceptStatus with the status the listing names as retired.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=Transgender Identity&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10&conceptStatus=Retired_Concept
    - fixture: recorded/evs/search-retired-only-page-2.json
      operation: OP-E08
      rationale: The second page of the retired-only search, which the cursor continues with the same selection.
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=Transgender Identity&type=contains&include=minimal,highlights&fromRecord=10&pageSize=10&conceptStatus=Retired_Concept
    - fixture: recorded/evs/search-retired-typeahead.json
      operation: OP-E08
      rationale: 'Typeahead for retired concepts alone: startsWith honours conceptStatus as contains does.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=transgender&type=startsWith&include=minimal,highlights&fromRecord=0&pageSize=10&conceptStatus=Retired_Concept
    - fixture: recorded/evs/search-go-obsolete.json
      operation: OP-E08
      rationale: 'A lexical search of GO, whose listing names a retired status ("true") that is no concept status: searched by default, it is answered; retired only is refused (search_concepts-7).'
      surface: evs
      path: /api/v1/concept/go_2026-07-26/search?term=obsolete&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10
    - fixture: recorded/evs/search-no-match.json
      operation: OP-E08
      rationale: 'A search matching nothing: empty is not an error.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=qqxyzzyqq&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10
    # Hierarchy.
    - fixture: recorded/evs/paths-to-root.json
      operation: OP-E13
      rationale: The paths from the concept to the root of the hierarchy.
      surface: evs
      path: /api/v1/concept/ncit_26.09d/C4817/pathsToRoot?include=minimal
    # An active code's replacements (OP-E21, and the ?list= batch form); the retired
    # code is in scenarios/retired/with-replacement.
