    - {<<: *unknown, fixture: scenarios/release/unknown/concepts.json, path: "/api/v1/concept/ncit_99.99z?list=C4817&include=summary"}
    - {<<: *unknown, fixture: scenarios/release/unknown/concept-c20197.json, path: "/api/v1/concept/ncit_99.99z/C20197?include=summary"}
