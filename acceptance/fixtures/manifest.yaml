      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC/maps?term=Ewing sarcoma&fromRecord=0&pageSize=10
    - fixture: recorded/evs/mapset-gdc-maps-code.json
      operation: OP-E25
      rationale: GDC maps found by an NCIt code.
      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC/maps?term=C4817&fromRecord=0&pageSize=10
    - fixture: recorded/evs/mapset-gdc-maps-none.json
      operation: OP-E25
      rationale: >-
        The GDC maps of a concept GDC does not map (C116977), none: an empty answer
        (resolve_stored_value, X-4).
      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC/maps?term=C116977&fromRecord=0&pageSize=10
    # A value set of 534 members (CDISC SDTM Method Terminology) through FHIR $expand.
    # A value set of 534 members (CDISC SDTM Method Terminology) through FHIR $expand.
    - fixture: recorded/evs-fhir/expand-c85492.json
      operation: OP-F05
      rationale: 'The unpinned expansion: system-version answers 400 today; count, offset and activeOnly are ignored.'
      surface: evs-fhir
      path: /ValueSet/$expand?url=http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl?fhir_vs=C85492
      ignored:
        count: &expand-ignores >-
          Verified 2 October 2026: count, offset and activeOnly leave the expansion
          unchanged (534 members, total 534); only expansion.parameter echoes them
        offset: *expand-ignores
        activeOnly: *expand-ignores

    # Scenarios recorded from live (the crafted ones come from craft.py).
    # release/unknown: every content path of an unknown release answers 404 "Terminology
    # not found", whatever is asked; recorded with the parameters a tool would send.
    - &unknown
      fixture: scenarios/release/unknown/concept.json
      operation: OP-E06
      rationale: 'An unknown release answers 404 on every content path: the server fails closed.'
      surface: evs
      path: /api/v1/concept/ncit_99.99z/C4817?include=summary
      status: 404
      ignored:
        "*": >-
          Verified 2 October 2026: EVS answers 404 "Terminology not found" for an unknown
