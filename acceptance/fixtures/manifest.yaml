# The fixture set: its pin, the concept rules, the scenarios, and what
# `pdm run acceptance-record` records (fixtures/README.md). Re-pinning the release is a
# re-recording under change control (docs/specification.md §4).

evs:
  release: ncit_26.09d
  # The concept rules (concepts.py). The include table was read from EVS on
  # 2 October 2026: each value adds these keys to the base, and `full` is the union
  # of the others; `paths`, `descendants` and `disjointWith` are not in it, so a
  # request for them goes unanswered.
  concepts:
    base: [code, name, terminology, version, conceptStatus, leaf, active]
    default: summary
    include:
      minimal: []
      summary: [synonyms, definitions, properties]
      synonyms: [synonyms]
      definitions: [definitions]
      properties: [properties]
      parents: [parents]
      children: [children]
      roles: [roles]
      inverseRoles: [inverseRoles]
      associations: [associations]
      inverseAssociations: [inverseAssociations]
      maps: [maps]
      history: [history]
      full: [synonyms, definitions, properties, parents, children, roles, inverseRoles,
             associations, inverseAssociations, maps, history]
    # The relation lists answered on their own, /api/v1/concept/{terminology}/{code}/{relation}
    # (operations OP-E10, E11, E14 to E17, E20).
    relations: [parents, children, roles, inverseRoles, associations, inverseAssociations, maps]

# The base URL of each recorded surface; a fixture's path is relative to it.
surfaces:
  evs: https://api-evsrest.nci.nih.gov
  evs-fhir: https://api-evsrest.nci.nih.gov/fhir/r4

# What each scenario provokes, in the order the register lists
# them (register.py). Whether a scenario is recorded or crafted is read from its fixtures.
scenarios:
  release/unknown: Every content path of `ncit_99.99z` answers 404
  release/mismatch: >-
    Every payload that reports the pinned release names 26.08e instead, the unpinned forms
    included; release discovery is left as recorded
  release/two-latest: >-
    A weekly and a monthly row are both `latest`, the weekly first in every list; each
    form of the release query gives a channel the same release
  batch/silent-drop: A code EVS does not know is left out of a batch
  retired/with-replacement: C154421 is retired with a replacement, and one bad code fails a batch
  traversal/deep-fanout: >-
    One root has 1,001 children, and a chain runs deeper than depth 4 from its first child,
    C99000001 (the node maximum is reached at depth 1 from the root)
  traversal/exclusions: Exclusion roles are named like positive ones, and two the other way
  traversal/starvation: One concept has 300 roles and 2 associations
  upstream/unavailable: Every EVS request, whatever its path, gets a closed connection, then 503, then no answer within the timeout
  upstream/rate-limited: 429 with `Retry-After` on the release query, then the answer
  license/restricted: 403 without the licence key; invented content with it

record:
  requests:
    # Release resolution: the listing, and the one-row query per channel (SPEC §3.3).
    - fixture: recorded/evs/version.json
      operation: baseline
      rationale: The furnished server's ncit_release_info reads it; no required tool needs it.
      surface: evs
      path: /api/v1/version
    - fixture: recorded/evs/terminologies.json
      operation: OP-E01
      rationale: The listing behind list_terminologies, and what the furnished server filters today.
      surface: evs
      path: /api/v1/metadata/terminologies
    - fixture: recorded/evs/release-monthly.json
      operation: OP-E01
      rationale: 'The one-row release query: latest is channel-scoped, so the channel is given as a tag (E-1).'
      surface: evs
      path: /api/v1/metadata/terminologies?terminology=ncit&latest=true&tag=monthly
    - fixture: recorded/evs/release-weekly.json
      operation: OP-E01
      rationale: The same query for the weekly channel.
      surface: evs
      path: /api/v1/metadata/terminologies?terminology=ncit&latest=true&tag=weekly
    # The relationship catalogue of the pinned release.
    - fixture: recorded/evs/roles.json
      operation: OP-E02
      rationale: The role catalogue of the pinned release, for polarity by code.
      surface: evs
      path: /api/v1/metadata/ncit_26.09d/roles
    - fixture: recorded/evs/associations.json
      operation: OP-E03
      rationale: The association catalogue of the pinned release.
      surface: evs
      path: /api/v1/metadata/ncit_26.09d/associations
    # Search: lexical, typeahead, a page after the first, and a query matching nothing.
    - fixture: recorded/evs/search-contains.json
      operation: OP-E08
      rationale: 'Lexical search: type=contains, minimal concepts with highlights for matchedOn, the page given in full.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=ewing sarcoma&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10
    - fixture: recorded/evs/search-contains-page-2.json
      operation: OP-E08
      rationale: The second page of the same search.
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=ewing sarcoma&type=contains&include=minimal,highlights&fromRecord=10&pageSize=10
    - fixture: recorded/evs/search-starts-with.json
      operation: OP-E08
      rationale: 'Typeahead: type=startsWith.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=ewing&type=startsWith&include=minimal,highlights&fromRecord=0&pageSize=10
    - fixture: recorded/evs/search-no-match.json
      operation: OP-E08
      rationale: 'A search matching nothing: empty is not an error.'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/search?term=qqxyzzyqq&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10
    # Hierarchy.
    - fixture: recorded/evs/paths-to-root.json
      operation: OP-E13
      rationale: The paths from the concept to the root of the hierarchy.
      surface: evs
      path: /api/v1/concept/ncit_26.09d/C4817/pathsToRoot?include=minimal
    # An active code's replacements (OP-E21, and the ?list= batch form); the retired
    # code is in scenarios/retired/with-replacement.
    - fixture: recorded/evs/replacement-active.json
      operation: OP-E21
      rationale: An active code's replacements, one code.
      surface: evs
      path: /api/v1/history/ncit_26.09d/C4817/replacements
    - fixture: recorded/evs/replacements-active.json
      operation: OP-E21
      rationale: The ?list= batch form, which fails the whole batch on one unknown code.
      surface: evs
      path: /api/v1/history/ncit_26.09d/replacements?list=C4817
    # Subsets: the GDC Value Terminology, unpinned (the pinned form is crafted under
    # `derived`) and the first page of its members.
    - fixture: recorded/evs/subset-gdc-unpinned.json
      operation: OP-E06
      rationale: 'The subset by its unpinned path: the pinned path answers 404 today; the payload names its release.'
      surface: evs
      path: /api/v1/subset/ncit/C177537
    - fixture: recorded/evs/subset-gdc-members.json
      operation: OP-E19
      rationale: The first page of a subset's members, keyed by the subset's code.
      surface: evs
      path: /api/v1/concept/ncit_26.09d/subsetMembers/C177537?fromRecord=0&pageSize=10&include=minimal
    # Mapsets: the listing (names and metadata only) and the GDC mapset.
    - fixture: recorded/evs/mapsets.json
      operation: OP-E23
      rationale: Mapsets as first-class objects, each with its own version.
      surface: evs
      path: /api/v1/mapset?include=minimal
    - fixture: recorded/evs/mapset-gdc.json
      operation: OP-E24
      rationale: The GDC mapset, versioned by the NCIt release.
      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC
    # Its maps (issue #6: the cross-domain tests need them), by a GDC value and by a
    # concept code; `term` matches as a prefix (C4817 also finds C48177).
    - fixture: recorded/evs/mapset-gdc-maps-value.json
      operation: OP-E25
      rationale: GDC maps found by a GDC value (resolve_stored_value); term matches as a prefix.
      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC/maps?term=Ewing sarcoma&fromRecord=0&pageSize=10
    - fixture: recorded/evs/mapset-gdc-maps-code.json
      operation: OP-E25
      rationale: GDC maps found by an NCIt code.
      surface: evs
      path: /api/v1/mapset/NCIt_Maps_To_GDC/maps?term=C4817&fromRecord=0&pageSize=10
    # A value set of 534 members (CDISC SDTM Method Terminology) through FHIR $expand.
    - fixture: recorded/evs-fhir/expand-c85492.json
      operation: OP-F05
      rationale: 'The unpinned expansion: system-version answers 400 today; count, offset and activeOnly are ignored.'
      surface: evs-fhir
      path: /ValueSet/$expand?url=http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl?fhir_vs=C85492
      ignored:
        count: &expand-ignores >-
          Verified 2 October 2026: count, offset and activeOnly leave the expansion
          unchanged (534 members, total 534); only expansion.parameter echoes them
        offset: *expand-ignores
        activeOnly: *expand-ignores

    # Scenarios recorded from live (the crafted ones come from craft.py).
    # release/unknown: every content path of an unknown release answers 404 "Terminology
    # not found", whatever is asked; recorded with the parameters a tool would send.
    - &unknown
      fixture: scenarios/release/unknown/concept.json
      operation: OP-E06
      rationale: 'An unknown release answers 404 on every content path: the server fails closed.'
      surface: evs
      path: /api/v1/concept/ncit_99.99z/C4817?include=summary
      status: 404
      ignored:
        "*": >-
          Verified 2 October 2026: EVS answers 404 "Terminology not found" for an unknown
          release on every content path, whatever the parameters
    - {<<: *unknown, fixture: scenarios/release/unknown/concepts.json, path: "/api/v1/concept/ncit_99.99z?list=C4817&include=summary"}
    - {<<: *unknown, fixture: scenarios/release/unknown/parents.json, path: /api/v1/concept/ncit_99.99z/C4817/parents}
    - {<<: *unknown, fixture: scenarios/release/unknown/children.json, path: /api/v1/concept/ncit_99.99z/C4817/children}
    - {<<: *unknown, fixture: scenarios/release/unknown/roles.json, path: /api/v1/concept/ncit_99.99z/C4817/roles}
    - {<<: *unknown, fixture: scenarios/release/unknown/inverse-roles.json, path: /api/v1/concept/ncit_99.99z/C4817/inverseRoles}
    - {<<: *unknown, fixture: scenarios/release/unknown/associations.json, path: /api/v1/concept/ncit_99.99z/C4817/associations}
    - {<<: *unknown, fixture: scenarios/release/unknown/inverse-associations.json, path: /api/v1/concept/ncit_99.99z/C4817/inverseAssociations}
    - {<<: *unknown, fixture: scenarios/release/unknown/maps.json, path: /api/v1/concept/ncit_99.99z/C4817/maps}
    - {<<: *unknown, fixture: scenarios/release/unknown/search.json, path: "/api/v1/concept/ncit_99.99z/search?term=ewing sarcoma&type=contains&include=minimal,highlights&fromRecord=0&pageSize=10"}
    - {<<: *unknown, fixture: scenarios/release/unknown/paths-to-root.json, path: "/api/v1/concept/ncit_99.99z/C4817/pathsToRoot?include=minimal"}
    - {<<: *unknown, fixture: scenarios/release/unknown/role-catalogue.json, path: /api/v1/metadata/ncit_99.99z/roles}
    - {<<: *unknown, fixture: scenarios/release/unknown/association-catalogue.json, path: /api/v1/metadata/ncit_99.99z/associations}
    - {<<: *unknown, fixture: scenarios/release/unknown/replacement.json, path: /api/v1/history/ncit_99.99z/C154421/replacements}
    - {<<: *unknown, fixture: scenarios/release/unknown/replacements.json, path: "/api/v1/history/ncit_99.99z/replacements?list=C154421"}
    - {<<: *unknown, fixture: scenarios/release/unknown/subset.json, path: /api/v1/subset/ncit_99.99z/C177537}
    - {<<: *unknown, fixture: scenarios/release/unknown/subset-members.json, path: "/api/v1/concept/ncit_99.99z/subsetMembers/C177537?fromRecord=0&pageSize=10&include=minimal"}
    - {<<: *unknown, fixture: scenarios/release/unknown/descendants.json, path: "/api/v1/concept/ncit_99.99z/C4817/descendants?maxLevel=4"}
    - {<<: *unknown, fixture: scenarios/release/unknown/property-catalogue.json, path: /api/v1/metadata/ncit_99.99z/properties}
    # batch/silent-drop: a code EVS does not know, which a batch leaves out (E-5).
    - fixture: scenarios/batch/silent-drop/concepts/CBOGUS999999.json
      operation: OP-E07
      rationale: 'A code EVS does not know: a batch leaves it out without a signal (E-5).'
      surface: evs
      path: /api/v1/concept/ncit_26.09d/CBOGUS999999?include=full
      status: 404
    # retired/with-replacement: C154421, retired with a replacement (A8), and a batch
    # that one unknown code fails as a whole.
    - fixture: scenarios/retired/with-replacement/concepts/C154421.json
      operation: OP-E05
      rationale: A retired concept (A8).
      surface: evs
      path: /api/v1/concept/ncit_26.09d/C154421?include=full
    - fixture: scenarios/retired/with-replacement/replacement.json
      operation: OP-E21
      rationale: A retired code with its replacement.
      surface: evs
      path: /api/v1/history/ncit_26.09d/C154421/replacements
    - fixture: scenarios/retired/with-replacement/replacements.json
      operation: OP-E21
      rationale: The batch form for the retired code.
      surface: evs
      path: /api/v1/history/ncit_26.09d/replacements?list=C154421
    - fixture: scenarios/retired/with-replacement/replacements-with-active.json
      operation: OP-E21
      rationale: A batch of a retired and an active code, answered per code.
      surface: evs
      path: /api/v1/history/ncit_26.09d/replacements?list=C154421,C4817
    - fixture: scenarios/retired/with-replacement/replacements-with-unknown.json
      operation: OP-E21
      rationale: One unknown code fails the whole batch (404).
      surface: evs
      path: /api/v1/history/ncit_26.09d/replacements?list=C154421,CBOGUS999999
      status: 404
    # license/restricted: EVS's refusal without the licence key; craft.py adds the answer
    # with it.
    - fixture: scenarios/license/restricted/refused.json
      operation: A7.5
      rationale: EVS refuses mdr without the X-EVSRESTAPI-License-Key header (403).
      surface: evs
      path: /api/v1/concept/mdr_29_0/10000000?include=summary
      status: 403
      ignored:
        "*": >-
          Verified 2 October 2026: EVS refuses every request for mdr without the licence
          key (403), whatever the path or parameters

  # Crafted fixtures for the form a requirement prescribes where EVS does not yet answer
  # it, each carrying the answer of a recording: the live run shows
  # the gap.
  derived:
    - fixture: crafted/OP-E06/subset-gdc.json
      operation: OP-E06
      rationale: The pinned subset path a requirement prescribes, carrying the unpinned answer.
      from: recorded/evs/subset-gdc-unpinned.json
      path: /api/v1/subset/ncit_26.09d/C177537
      requirement: >-
        OP-E06: every content path accepts {terminology}_{release}. EVS answered this
        pinned path with 404 "Subset not found" on 2 October 2026
    - fixture: crafted/OP-F05/expand-c85492.json
      operation: OP-F05
      rationale: "$expand pinned by system-version, as the operation inventory prescribes (OP-F05), carrying the unpinned answer."
      from: recorded/evs-fhir/expand-c85492.json
      path: /ValueSet/$expand?url=http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl?fhir_vs=C85492&system-version=http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl|26.09d
      requirement: >-
        OP-F05: $expand pinned by system-version. EVS answered "Input parameter
        'system-version' is not supported" (400) on 2 October 2026
      ignored:
        count: *expand-ignores
        offset: *expand-ignores
        activeOnly: *expand-ignores

  # Concepts, by the include each is recorded at (concepts.py).
  concepts:
    # Ewing sarcoma and the batch of the Platform API Specification's E-5 example.
    full: [C4817, C17049, C41259]
    # The depth-1 neighbourhood of C4817 over every relation. Without the inverse
    # lists, which run to megabytes for the subset and cell concepts among them.
    summary,parents,children,roles,associations,maps,history:
      [C116977, C118168, C118464, C12578, C126659, C12917, C12922, C12950, C12964, C13054,
       C132849, C138188, C138190, C142853, C156952, C156966, C157711, C158520, C165258, C165667,
       C165668, C168655, C168656, C168657, C168658, C168661, C168662, C174456, C176985, C177537,
       C177615, C177621, C178243, C178457, C178458, C18322, C189002, C189762, C202904, C21513,
       C227412, C27214, C27291, C2869, C3038, C34222, C35380, C35942, C36105, C36115, C36122,
       C36184, C36367, C36368, C36369, C36616, C36779, C37224, C37229, C37230, C37231, C37249,
       C37250, C37251, C37252, C45455, C45714, C4835, C53487, C53665, C53667, C53978, C53980,
       C54105, C7135, C7806, C7807, C7808, C8495, C90259, C9118, C9292, C99202, C99211, C99226,
       C99259, C99262, C99281]

  # Real projections and batches the composed answers are checked against.
  samples:
    - /api/v1/concept/ncit_26.09d/C4817
    - /api/v1/concept/ncit_26.09d/C4817?include=minimal
    - /api/v1/concept/ncit_26.09d/C4817?include=summary
    - /api/v1/concept/ncit_26.09d/C4817?include=full
    - /api/v1/concept/ncit_26.09d/C4817?include=synonyms
    - /api/v1/concept/ncit_26.09d/C4817?include=definitions
    - /api/v1/concept/ncit_26.09d/C4817?include=properties
