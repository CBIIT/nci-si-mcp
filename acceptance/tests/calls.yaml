# One call of each content-returning tool whose upstream answers are in the fixture set, made
# by the cross-cutting tests (test_crosscutting.py). The fixture set's terminology and release
# are added to the arguments of every tool that takes them; `scenario` names the scenario the
# call needs, for a concept only a scenario holds.
#
# `unpinned` marks a call whose operation has no release-pinned form upstream (the register's
# table of operations without one): the tool asks the unpinned form and verifies the release
# the payload reports (A3.2), so for a release the platform does not serve it can report only
# the mismatch. `unversioned` marks a call whose upstream answers may name no release at all
# (relation lists, a replacement history), so that content of another release cannot show in
# them (X-3).
#
# `upstream` lists fields the call's upstream answer supplies about each item's origin, which
# its provenance passes through unchanged (X-8); `$terminology` and `$release` stand for the
# fixture set's pin. `empty` gives arguments, in place of the call's, that legitimately match
# nothing (X-4). `truncating` gives arguments, added to the call's, under which the result
# exceeds a bound, the bound the truncation record must name, and its `limit` where no argument
# sets it, as the platform's own cap (X-10); a limit that a
# cursor or an offset continues pages instead, and is not one (M6.1, X-17). `paged` lists
# calls, each with arguments added to the call's under which the result is larger than the
# page asked for, so that it carries a cursor to the next page (X-17); `changed` lists
# arguments, each of which, given with the cursor in place of the first call's, alters the
# result, and `prepared` marks a call that searches the interim index (the prepare step). The defaults
# a cursor's arguments are compared with are the specification's (spec/tools.yaml).
# `defaulted` lists further calls, each with its scenario, whose result a wrong default would
# change where the call's own cannot: a stated default below what the result holds (X-20).
#
# A limit a call gives is the page size of the recordings; a server's own default could ask
# for another, which no fixture answers.

resolve_release: {arguments: {}}
get_concept:
  arguments: {code: C4817}
  upstream: &concept {terminology: $terminology, version: $release}
get_concepts:
  arguments: {codes: [C4817]}
  upstream: *concept
search_concepts:
  arguments: {query: ewing sarcoma, mode: lexical, limit: 10}   # 1,027 matches
  upstream: *concept
  empty: {query: qqxyzzyqq, mode: lexical, limit: 10}
  paged:
    - arguments: {}
      changed: [{retired: only}, {limit: 5}, {query: ewing}, {mode: typeahead}]
    - arguments: {mode: semantic}   # every indexed concept ranked (search_concepts-3), a page of 10
      prepared: true
      changed: [{mode: hybrid}, {retired: only}, {query: ewing}, {limit: 5}]
get_concept_hierarchy:
  arguments: {code: C4817, direction: parent}
  unversioned: true
  defaulted:   # 1,001 children against the limit's default of 200
    - {scenario: traversal/deep-fanout, arguments: {code: C99000000, direction: child}}
  paged:   # C4817 has 10 children
    - arguments: {direction: child, limit: 5}
      changed: [{depth: 2}, {limit: 6}, {direction: parent}, {code: C9118}]
expand_value_set:
  arguments: {valueSet: C85492}
  unpinned: true
  upstream: {url: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl?fhir_vs=C85492", version: $release}
get_concept_neighborhood:
  arguments: {code: C4817, depth: 1}
  unversioned: true
  truncating: {arguments: {maxNodes: 2}, bound: nodes}   # C4817: 93 assertions, 88 concepts
  defaulted:
    # 1,001 children against maxNodes' default of 200; a chain deeper than depth's default of 2.
    - {scenario: traversal/deep-fanout, arguments: {code: C99000000, kinds: [child]}}
    - {scenario: traversal/deep-fanout, arguments: {code: C99000001, kinds: [child]}}
get_concept_subsets: {arguments: {code: C4817}}
get_concept_mappings:
  arguments: {code: C4817}
  empty: {code: C4817, targetTerminology: SNOMEDCT_US}   # C4817 maps to no SNOMED CT term
resolve_retired_code: {arguments: {code: C4817}}   # active: its concept names the release
list_relationships: {arguments: {}}
list_terminologies: {arguments: {}}

# caDSR. No call pins a registry release (X-21), so none takes the fixture set's terminology and
# release; `upstream` is what caDSR says of the item's origin, under its names (A4.3).
get_data_element:
  arguments: {publicId: "2200604"}
  upstream: {publicId: "2200604", version: "4"}
get_form:
  arguments: {publicId: "5406471"}
  upstream: {publicID: "5406471", version: "1.0"}
match_value_meanings: {arguments: {values: [Male]}}
get_code_map:
  arguments: {}   # the CRDC list's 105 data elements against the limit's default of 100
  empty: {targetContext: No such commons}
  paged:
    - arguments: {limit: 40}
      changed: [{limit: 41}, {targetContext: GDC}, {dataElementId: "88"}]
# Crafted: no keyword search exists today, and the crafted answer of its form is the
# contract's cap of 1,000 data elements (crafted/OP-C03/search-over-cap.json).
search_data_elements:
  arguments: {query: patient}
  empty: {query: qqxyzzyqq}
  truncating: {arguments: {}, bound: upstream_cap, limit: 1000}   # the contract's cap
  paged:
    - arguments: {}
      changed: [{limit: 11}, {query: gender}]
# Crafted to the contracts the APIs publish, which refuse an anonymous caller.
match_data_elements:
  arguments: {entities: [{name: Patient Gender}]}
  scenario: cadsr/credentialed
list_contexts:
  arguments: {}
  scenario: cadsr/credentialed
  paged:
    - arguments: {limit: 5}
      changed: [{limit: 6}]
# The cross-domain tools. The fixture set's release is added, so the Shared SI Service answers
# (a release can be verified only against its NCIt graph): there is no pinned form, only the
# graph's identity to compare with (unpinned).
find_data_elements_for_concept:
  arguments: {conceptCode: C17357}   # Gender: 17 data elements in the caDSR graph
  unpinned: true
  empty: {conceptCode: C116977}
  truncating:   # Disease or Disorder's descendants: more than the maximum
    arguments: {conceptCode: C2991, expandDescendants: true, limit: 1000}
    bound: results
    limit: 1000
  paged:
    - arguments: {limit: 5}
      changed: [{limit: 6}, {expandDescendants: true}, {includePermissibleValues: true}]
get_concept_for_permissible_value: {arguments: {dataElementId: "2200604", value: Male}}
resolve_stored_value:
  arguments: {conceptCode: C4817, commons: GDC}
  empty: {conceptCode: C116977, commons: GDC}
get_release_alignment: {arguments: {}}
