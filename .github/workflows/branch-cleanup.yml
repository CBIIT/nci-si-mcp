name: Branch cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'milestone/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Execute only the script from the merged revision on main. The retained
      # refs/pull/<number>/head is fetched as an ancestry target, never checked out or run.
      - name: Delete merged branches and record their tips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_HEAD: ${{ github.event.pull_request.head.sha }}
          MILESTONE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/branch_cleanup.py
