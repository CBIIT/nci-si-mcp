name: Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly: a vulnerability published since the last change

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Audit every locked group and platform, not just the runner's installed packages.
  # The local acceptance project has no external advisory identity; exclude only that line.
  # PDM's --no-markers filters to the current platform before stripping: normalize after export.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Reject dependencies released inside five days
        run: pdm run python scripts/dependency_age.py
      - name: Audit every locked dependency group
        run: |
          pdm export -G :all --without-hashes --no-extras -o "$RUNNER_TEMP/all-requirements.txt"
          sed -e '\|^-e \./acceptance#egg=nci-si-acceptance$|d' -e 's/;.*//' "$RUNNER_TEMP/all-requirements.txt" > "$RUNNER_TEMP/requirements.txt"
          pdm run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict

  # A pull request that brings in a dependency with a known vulnerability of high severity fails.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
