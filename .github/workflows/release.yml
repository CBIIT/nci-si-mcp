name: Release

# Tags and releases the commit on main that CI has just validated. The version
# comes from the Conventional Commit subjects since the last tag (the rules are in
# [tool.semantic_release] in pyproject.toml). The workflow adds a tag and a GitHub
# release; it never pushes a commit to main.
#
# Why `workflow_run` and not `push` or `pull_request: [closed]`:
#   - `push` would release code whose CI has not finished, or has failed.
#   - `pull_request: closed` fires on the head of the pull request, which is not
#     the commit that landed on main.

on:
  # The manual way out. The automatic path skips a commit when main has moved past
  # it, and relies on the newer commit's CI run to release both. If that later run
  # does not fire, the release is lost while main stays green, and only a manual
  # run (or another commit) recovers it.
  workflow_dispatch:
    inputs:
      retry_image_tag:
        description: Existing release tag at main to retry image publication after a failed image job
        required: false
        type: string

  # zizmor: ignore[dangerous-triggers] the job runs no code from a pull request: it
  # checks out main and releases only the commit that the CI run validated.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_sha: ${{ steps.image.outputs.sha }}
    permissions:
      contents: write  # push the tag and create the GitHub release
      actions: read  # require successful CI for the exact checked-out main commit
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # semantic-release reads the whole history and the tags
          persist-credentials: false  # the release step pushes the tag with its own token

      - name: Decide whether this commit is released
        id: guard
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ -z "${VALIDATED_SHA:-}" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$head" != "$GITHUB_SHA" ]; then
              echo "::error::Dispatch Release again on the validated main commit; attestation source must match the image."
              exit 1
            fi
            python3 -m scripts.release_ci "$head"
            echo "Manual run: releasing the tip of main ($head)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$head" != "$VALIDATED_SHA" ]; then
            echo "main has moved past $VALIDATED_SHA; the CI run of the newer commit releases it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release tooling
        if: steps.guard.outputs.skip == 'false'
        uses: $/.github/actions/setup
        with:
          release-only: "true"

      - name: Semantic release
        id: release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pdm run semantic-release -v version --no-commit --tag --push --no-changelog --vcs-release --skip-build

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          SKIPPED: ${{ steps.guard.outputs.skip }}
          OUTCOME: ${{ steps.release.outcome }}
          RELEASED: ${{ steps.release.outputs.released }}
          TAG: ${{ steps.release.outputs.tag }}
          LINK: ${{ steps.release.outputs.link }}
        run: |
          {
            echo "## Release"
            echo
            if [ "$SKIPPED" = "true" ]; then
              echo "Skipped: main has moved past the validated commit. The CI run of the newer commit releases it."
            elif [ "$OUTCOME" != "success" ]; then
              echo "The release step did not succeed; read the log. If the tag was not pushed, start"
              echo "the workflow by hand. If it was, the GitHub release is missing: create it with"
              echo "\`gh release create <tag> --verify-tag --generate-notes\`."
            elif [ "$RELEASED" = "true" ]; then
              echo "Released **$TAG**: $LINK"
            else
              echo "No release: no \`feat\`, \`fix\`, \`perf\` or breaking (\`!\`) commit since the last tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select the exact released commit for image publication
        id: image
        if: steps.guard.outputs.skip == 'false'
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RETRY_TAG: ${{ inputs.retry_image_tag }}
        run: |
          tag=""
          if [ "$RELEASED" = "true" ]; then tag="$RELEASE_TAG"; fi
          if [ -n "$RETRY_TAG" ]; then tag="$RETRY_TAG"; fi
          if [ -z "$tag" ]; then exit 0; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "$tag^{commit}")"
          test "$sha" = "$(git rev-parse HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  image:
    name: release image
    needs: release
    if: needs.release.outputs.image_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # attach image security evidence and digest to the release
      packages: write  # push the verified release image to GHCR
      id-token: write  # sign image attestations with this workflow's OIDC identity
      attestations: write  # store provenance and SBOM attestations for the pushed digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.image_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/image
      - name: Publish the verified image and security evidence
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.image_tag }}
        run: pdm run python -m scripts.image_publish "$RELEASE_TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.subject-name }}
          subject-digest: ${{ steps.publish.outputs.subject-digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.subject-name }}
          subject-digest: ${{ steps.publish.outputs.subject-digest }}
          sbom-path: tmp/image/sbom.cdx.json
          push-to-registry: true

  local-installer:
    name: local installer (macOS/Linux)
    needs: release
    if: needs.release.outputs.image_tag != ''
    permissions:
      contents: read
    uses: $/.github/workflows/local-installer.yml
    with:
      ref: ${{ needs.release.outputs.image_sha }}
      tag: ${{ needs.release.outputs.image_tag }}
