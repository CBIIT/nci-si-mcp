name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Every commit on
# main gets its own run, which is never cancelled or replaced: it validates the
# commit that a release is cut from.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: mutation (diff)
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    needs: [test, unit-coverage, selftest, coverage, acceptance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mutation-coverage-${{ github.sha }}-*
          path: tmp/mutation-coverage
      - name: Mutate every changed Python site
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          SHARD: ${{ matrix.shard }}/3
        run: pdm run mutation-gate --base "$BASE_SHA" --head "$HEAD_SHA" --shard "$SHARD" -n 2 --coverage-dir tmp/mutation-coverage

  changes:
    name: image selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.select.outputs.image }}
      companions: ${{ steps.select.outputs.companions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Select images from the event change set
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci_images "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  companions:
    name: companion containers (amd64)
    needs: [changes, documentation]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.companions == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the documentation producer
        if: needs.documentation.result != 'success'
        run: |
          echo "::error::The documentation artifact producer did not succeed."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: documentation-preview-${{ github.sha }}
          path: tmp/docs-site
      - run: pdm run python -m scripts.companion_context --site tmp/docs-site
      - name: Build isolated local images
        run: |
          docker build --platform linux/amd64 --load -t nci-si-docs:local tmp/companion-context/docs
          docker build --platform linux/amd64 --load -t nci-si-admin:local tmp/companion-context/admin
      - name: Verify real runtime boundaries and fixture results
        run: pdm run python -m scripts.companion_smoke
      - name: Scan every companion and retain SBOMs
        run: |
          mkdir -p tmp/companion-security
          for image in docs admin; do
            docker save --output "tmp/companion-security/$image.tar" "nci-si-$image:local"
            docker run --rm -v "$PWD/tmp/companion-security:/evidence" -v nci-si-trivy-cache:/root/.cache/trivy docker.io/aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input "/evidence/$image.tar" --scanners vuln --format json --output "/evidence/$image-scan.json"
            docker run --rm -v "$PWD/tmp/companion-security:/evidence" -v nci-si-trivy-cache:/root/.cache/trivy docker.io/aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input "/evidence/$image.tar" --format cyclonedx --output "/evidence/$image-sbom.cdx.json"
          done
          pdm run python scripts/image_scan.py tmp/companion-security/docs-scan.json
          pdm run python scripts/image_scan.py tmp/companion-security/admin-scan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: companion-security-evidence
          path: tmp/companion-security/*.json
          if-no-files-found: warn
          retention-days: 30

  documentation:
    name: documentation artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix docs/site-assets --ignore-scripts
      - run: npm audit --prefix docs/site-assets --audit-level high
      - run: npm run build --prefix docs/site-assets
      - run: pdm run acceptance-stories --check
      - run: pdm run docs-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/site-assets/package-lock.json') }}
      # Browser binaries can be reused; Linux system libraries belong to this runner.
      - run: npm exec --prefix docs/site-assets -- playwright install-deps chromium
      - run: npm exec --prefix docs/site-assets -- playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run test:browser --prefix docs/site-assets
      # Documentation only: never upload an evidence database, operational report or tmp/ tree.
      # PR artifacts are previews; this job has no deployment permissions or promotion step.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: documentation-preview-${{ github.sha }}
          path: tmp/docs-site/
          if-no-files-found: error
          retention-days: 30

  image:
    name: container (amd64)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/image

  # The pre-commit hooks, on all files. A commit checks only the files it changes,
  # so this also catches a file that a change elsewhere (a rule, a pin) put in breach.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pdm run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (3.14, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Serial partitions preserve child/phase ownership; the complete suite exceeded 10 minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # The minimum applies to the combined partitions in unit-coverage, not each partition.
      # Includes the recorded retrieval sample and activation gate with a test-only hashing
      # calibration. It tests execution and arithmetic, not real-model retrieval quality.
      - name: Configure shared unit coverage
        run: pdm run python -m scripts.validation.mutation_coverage configure unit --output tmp/mutation-config
      - name: Test, including recorded retrieval evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}
          COVERAGE_PROCESS_START: ${{ github.workspace }}/tmp/mutation-config/.coveragerc
          UNIT_SHARD: ${{ matrix.shard }}
        run: pdm run test --unit-shard "$UNIT_SHARD" -n 0 -p scripts.validation.mutation_probe --cov-config=tmp/mutation-config/.coveragerc --cov-context=test --cov-fail-under=0 --cov-report= --junitxml=tmp/test-results/unit.xml
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: pdm run python scripts/junit_summary.py tmp/test-results/unit.xml "Unit tests" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-test-results-${{ strategy.job-index }}
          path: tmp/test-results/unit.xml
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-coverage-${{ strategy.job-index }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Export shared unit coverage
        env:
          UNIT_SHARD: ${{ matrix.shard }}
        run: pdm run python -m scripts.validation.mutation_coverage export unit --data .coverage --shard "$UNIT_SHARD" --output tmp/mutation-coverage/unit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-coverage-${{ github.sha }}-unit-${{ strategy.job-index }}
          path: tmp/mutation-coverage/unit.json
          if-no-files-found: error
          retention-days: 1

  unit-coverage:
    name: unit coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: unit-coverage-*
          path: unit-coverage
      - name: Combine every unit shard and enforce the minimum
        run: |
          shards=(unit-coverage/unit-coverage-*)
          test "${#shards[@]}" -eq 4
          pdm run coverage combine unit-coverage/unit-coverage-{0,1,2,3}/.coverage
          pdm run coverage report --include='*/src/nci_si_mcp/*,*/src/ncit_index/*,*/scripts/*' --omit='*/scripts/companion_entry.py'
      # Falling short of the aim is reported, not enforced (CONTRIBUTING.md, standard 3).
      - name: Report coverage against the aim
        run: |
          total="$(pdm run coverage report --include='*/src/nci_si_mcp/*,*/src/ncit_index/*,*/scripts/*' --omit='*/scripts/companion_entry.py' --format=total)"
          echo "Coverage ${total}% (the aim is above 97%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v total="$total" 'BEGIN { exit !(total <= 97) }'; then
            echo "::warning title=Coverage is not above 97%::${total}%. Cover the untested behaviour; do not pad."
          fi
      - name: Export measured server coverage
        run: pdm run coverage json --include='*/src/nci_si_mcp/*,*/src/ncit_index/*,*/scripts/*' --omit='*/scripts/companion_entry.py' -o tmp/coverage/server.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: badge-coverage-server
          path: tmp/coverage/server.json
          if-no-files-found: error
          retention-days: 30

  # The acceptance suite against the server built from this checkout, on the recorded and crafted
  # upstream answers: a ratchet over individual tests. Every test must have the outcome in
  # acceptance/expected/fixture.json, so the job stays green while tools are NOT IMPLEMENTED or
  # FAIL and fails when a test changes its outcome; a change that moves outcomes on purpose
  # updates that file in the same pull request. It depends on no other job.
  acceptance:
    name: acceptance (fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Pytest's exit status 0 (all passed) and 1 (some failed) are both a run; the verdict is the
      # comparison below. Any other status (usage error, interruption, a crash) or a missing
      # report is a run that did not happen.
      - name: Configure shared fixture coverage
        run: pdm run python -m scripts.validation.mutation_coverage configure fixture --output tmp/mutation-config
      - name: Run the suite against the fixtures
        id: fixture
        env:
          PYTHONPATH: ${{ github.workspace }}
          COVERAGE_PROCESS_START: ${{ github.workspace }}/tmp/mutation-config/.coveragerc
          NCI_SI_ACCEPTANCE_REGISTRY_RELEASE: required
          NCI_SI_ACCEPTANCE_SECURITY_SERVER: python ../scripts/permissions_fixture.py
          # The README's prepare step: it builds the interim NCIt index every server starts from.
          NCI_SI_ACCEPTANCE_PREPARE: 'nci-si-mcp index-sample $(cat "$NCI_SI_ACCEPTANCE_INDEX_CODES")'
        run: |
          status=0
          started="$(date +%s)"
          pdm run acceptance -n 4 --dist worksteal -p scripts.validation.mutation_probe --cov --cov-config=../tmp/mutation-config/.coveragerc --cov-context=test --cov-fail-under=0 --cov-report= --report=fixture.json || status=$?
          seconds=$(( $(date +%s) - started ))
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Fixture run: ${seconds} s of the 600 s limit, exit status ${status}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$seconds" -ge 420 ]; then
            echo "::warning title=The acceptance run is slow::It took ${seconds} s; shard it before the 10-minute limit."
          fi
          if [ "$status" -gt 1 ]; then
            echo "::error title=The acceptance run did not finish::pytest exited with status ${status}."
            exit "$status"
          fi
          if [ ! -s acceptance/fixture.json ]; then
            echo "::error title=No report::The run wrote no acceptance/fixture.json."
            exit 1
          fi
      - name: Compare the outcomes with the expected ones
        if: ${{ always() && hashFiles('acceptance/fixture.json') != '' }}
        run: |
          status=0
          pdm run acceptance-expected check acceptance/fixture.json > acceptance/difference.md || status=$?
          { echo "### Outcomes against acceptance/expected/fixture.json"; echo; cat acceptance/difference.md; } >> "$GITHUB_STEP_SUMMARY"
          cat acceptance/difference.md
          exit "$status"
      - name: Render the per-tool report
        if: ${{ always() && hashFiles('acceptance/fixture.json') != '' }}
        run: |
          pdm run python -m nci_si_acceptance.report acceptance/fixture.json > acceptance/report.md
          { echo "### Per-tool report (fixture mode)"; echo; cat acceptance/report.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() && hashFiles('acceptance/fixture.json') != '' }}
        with:
          name: acceptance-fixture
          path: |
            acceptance/fixture.json
            acceptance/report.md
          if-no-files-found: error
          retention-days: 30

      - name: Export shared fixture coverage
        env:
          FIXTURE_STATUS: ${{ steps.fixture.outputs.status }}
        run: |
          test "$FIXTURE_STATUS" -eq 0
          pdm run python -m scripts.validation.mutation_coverage export fixture --data acceptance/.coverage --shard 1/1 --output tmp/mutation-coverage/fixture.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-coverage-${{ github.sha }}-fixture
          path: tmp/mutation-coverage/fixture.json
          if-no-files-found: error
          retention-days: 1

  # Included in the aggregate required check alongside the stdio fixture run.
  acceptance-http:
    name: acceptance (HTTP fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Run every applicable remote fixture case and report required skips
        run: pdm run acceptance-http
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() && hashFiles('acceptance/http-fixture.json') != '' }}
        with:
          name: acceptance-http-fixture
          path: acceptance/http-fixture.json
          if-no-files-found: error
          retention-days: 30

  # The acceptance harness's own tests, shared out between eight jobs that run at once
  # (selftests/conftest.py); each keeps its coverage data for the coverage job. They set the
  # pace of CI: add a shard when one takes more than about four minutes.
  selftest:
    name: selftest (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # The minimum applies to the shards together, in the coverage job.
      - name: Configure shared selftest coverage
        run: pdm run python -m scripts.validation.mutation_coverage configure selftest --output tmp/mutation-config
      - run: pdm run acceptance-selftest -p scripts.validation.mutation_probe --cov-config=../tmp/mutation-config/.coveragerc --cov-context=test --cov-fail-under=0 --cov-report= --junitxml=tmp/test-results/selftest.xml
        env:
          PYTHONPATH: ${{ github.workspace }}
          COVERAGE_PROCESS_START: ${{ github.workspace }}/tmp/mutation-config/.coveragerc
          SELFTEST_SHARD: ${{ matrix.shard }}
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: pdm run python scripts/junit_summary.py acceptance/tmp/test-results/selftest.xml "Harness self-tests" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: selftest-results-${{ strategy.job-index }}
          path: acceptance/tmp/test-results/selftest.xml
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: selftest-coverage-${{ strategy.job-index }}
          path: acceptance/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Export shared selftest coverage
        env:
          SELFTEST_SHARD: ${{ matrix.shard }}
        run: pdm run python -m scripts.validation.mutation_coverage export selftest --data acceptance/.coverage --shard "$SELFTEST_SHARD" --output tmp/mutation-coverage/selftest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-coverage-${{ github.sha }}-selftest-${{ strategy.job-index }}
          path: tmp/mutation-coverage/selftest.json
          if-no-files-found: error
          retention-days: 1

  # The self-tests' coverage over all eight shards, with the harness's minimum
  # (acceptance/pyproject.toml); falling short of the aim is reported, not enforced.
  coverage:
    name: coverage
    needs: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: selftest-coverage-*
          path: selftest-coverage
      - name: Combine the shards and enforce the minimum
        run: |
          pdm run coverage combine --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest selftest-coverage/*/.coverage
          pdm run coverage report --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest --include='*/acceptance/src/*'
          total="$(pdm run coverage report --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest --include='*/acceptance/src/*' --format=total)"
          echo "Self-test coverage ${total}% (the aim is above 97%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v total="$total" 'BEGIN { exit !(total <= 97) }'; then
            echo "::warning title=Self-test coverage is not above 97%::${total}%. Cover the untested behaviour; do not pad."
          fi
      - name: Export measured harness coverage
        run: pdm run coverage json --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest --include='*/acceptance/src/*' -o tmp/coverage/harness.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: badge-coverage-harness
          path: tmp/coverage/harness.json
          if-no-files-found: error
          retention-days: 30

  coverage-badges-render:
    name: render coverage badges
    needs: [unit-coverage, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: badge-coverage-*
          merge-multiple: true
          path: tmp/coverage
      - name: Render badges and source measurements
        run: pdm run python scripts/coverage_badges.py tmp/coverage tmp/coverage-badges
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: badge-data-${{ github.sha }}
          path: |
            tmp/coverage-badges/server.json
            tmp/coverage-badges/harness.json
            tmp/coverage-badges/provenance.json
          if-no-files-found: error
          retention-days: 1

  required:
    name: required
    needs: [mutation, changes, companions, documentation, image, quality, test, unit-coverage, acceptance, acceptance-http, selftest, coverage, coverage-badges-render, coverage-badges]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Require every CI result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_required

  coverage-badges:
    name: publish coverage badges
    # mutation is PR-only; its deliberate main skip must not suppress publication.
    needs: [changes, quality, test, unit-coverage, coverage, acceptance, acceptance-http, image, documentation, companions, coverage-badges-render]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # only fixed data publication; no checkout or repository execution
    concurrency:
      group: coverage-badges-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: badge-data-${{ github.sha }}
          path: tmp/coverage-badges
      - name: Publish generated badge data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "main has moved; leave publication to its successful CI run."
            exit 0
          fi
          gh auth setup-git
          directory="$RUNNER_TEMP/coverage-badges"
          git init --quiet --initial-branch=coverage-badges "$directory"
          git -C "$directory" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          existing="$(git -C "$directory" ls-remote --heads origin coverage-badges)"
          if [ -n "$existing" ]; then
            git -C "$directory" fetch --depth=1 origin coverage-badges
            git -C "$directory" reset --hard FETCH_HEAD
          fi
          cp tmp/coverage-badges/server.json tmp/coverage-badges/harness.json tmp/coverage-badges/provenance.json "$directory/"
          git -C "$directory" config user.name "Coverage CI"
          git -C "$directory" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$directory" add server.json harness.json provenance.json
          if git -C "$directory" diff --cached --quiet; then exit 0; fi
          git -C "$directory" commit -m "ci: refresh coverage badges"
          git -C "$directory" push origin HEAD:refs/heads/coverage-badges
