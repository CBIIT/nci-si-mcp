name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Every commit on
# main gets its own run, which is never cancelled or replaced: it validates the
# commit that a release is cut from.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: image selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.select.outputs.image }}
      companions: ${{ steps.select.outputs.companions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"
      - name: Select images from the event change set
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_images.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  companions:
    name: companion containers (amd64)
    needs: [changes, documentation]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.companions == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the documentation producer
        if: needs.documentation.result != 'success'
        run: |
          echo "::error::The documentation artifact producer did not succeed."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: documentation-preview-${{ github.sha }}
          path: tmp/docs-site
      - run: pdm run python -m scripts.companion_context --site tmp/docs-site
      - name: Build isolated local images
        run: |
          docker build --platform linux/amd64 --load -t nci-si-docs:local tmp/companion-context/docs
          docker build --platform linux/amd64 --load -t nci-si-admin:local tmp/companion-context/admin
      - name: Verify real runtime boundaries and fixture results
        run: pdm run python -m scripts.companion_smoke
      - name: Scan every companion and retain SBOMs
        run: |
          mkdir -p tmp/companion-security
          for image in docs admin; do
            docker save --output "tmp/companion-security/$image.tar" "nci-si-$image:local"
            docker run --rm -v "$PWD/tmp/companion-security:/evidence" -v nci-si-trivy-cache:/root/.cache/trivy docker.io/aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input "/evidence/$image.tar" --scanners vuln --format json --output "/evidence/$image-scan.json"
            docker run --rm -v "$PWD/tmp/companion-security:/evidence" -v nci-si-trivy-cache:/root/.cache/trivy docker.io/aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input "/evidence/$image.tar" --format cyclonedx --output "/evidence/$image-sbom.cdx.json"
          done
          pdm run python scripts/image_scan.py tmp/companion-security/docs-scan.json
          pdm run python scripts/image_scan.py tmp/companion-security/admin-scan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: companion-security-evidence
          path: tmp/companion-security/*.json
          if-no-files-found: warn
          retention-days: 30

  documentation:
    name: documentation artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix docs/site-assets --ignore-scripts
      - run: npm audit --prefix docs/site-assets --audit-level high
      - run: npm run build --prefix docs/site-assets
      - run: pdm run acceptance-stories --check
      - run: pdm run docs-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/site-assets/package-lock.json') }}
      # Browser binaries can be reused; Linux system libraries belong to this runner.
      - run: npm exec --prefix docs/site-assets -- playwright install-deps chromium
      - run: npm exec --prefix docs/site-assets -- playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npm run test:browser --prefix docs/site-assets
      # Documentation only: never upload an evidence database, operational report or tmp/ tree.
      # PR artifacts are previews; this job has no deployment permissions or promotion step.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation-preview-${{ github.sha }}
          path: tmp/docs-site/
          if-no-files-found: error
          retention-days: 30

  image:
    name: container (amd64)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/image

  # The pre-commit hooks, on all files. A commit checks only the files it changes,
  # so this also catches a file that a change elsewhere (a rule, a pin) put in breach.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pdm run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # The suite with line and branch coverage; it fails below the minimum in pyproject.toml.
      # Includes the recorded retrieval sample and activation gate with a test-only hashing
      # calibration. It tests execution and arithmetic, not real-model retrieval quality.
      - name: Test, including recorded retrieval evaluation
        run: pdm run test
      # Falling short of the aim is reported, not enforced (CONTRIBUTING.md, standard 3).
      - name: Report coverage against the aim
        run: |
          total="$(pdm run coverage report --format=total)"
          echo "Coverage ${total}% (the aim is above 95%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v total="$total" 'BEGIN { exit !(total <= 95) }'; then
            echo "::warning title=Coverage is not above 95%::${total}%. Cover the untested behaviour; do not pad."
          fi
      - name: Export measured server coverage
        run: pdm run coverage json -o tmp/coverage/server.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: badge-coverage-server
          path: tmp/coverage/server.json
          if-no-files-found: error
          retention-days: 30

  # The acceptance suite against the server built from this checkout, on the recorded and crafted
  # upstream answers: a ratchet over individual tests. Every test must have the outcome in
  # acceptance/expected/fixture.json, so the job stays green while tools are NOT IMPLEMENTED or
  # FAIL and fails when a test changes its outcome; a change that moves outcomes on purpose
  # updates that file in the same pull request. It depends on no other job.
  acceptance:
    name: acceptance (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Pytest's exit status 0 (all passed) and 1 (some failed) are both a run; the verdict is the
      # comparison below. Any other status (usage error, interruption, a crash) or a missing
      # report is a run that did not happen.
      - name: Run the suite against the fixtures
        env:
          NCI_SI_ACCEPTANCE_SECURITY_SERVER: python ../scripts/permissions_fixture.py
          # The README's prepare step: it builds the interim NCIt index every server starts from.
          NCI_SI_ACCEPTANCE_PREPARE: 'nci-si-mcp index-sample $(cat "$NCI_SI_ACCEPTANCE_INDEX_CODES")'
        run: |
          status=0
          started="$(date +%s)"
          pdm run acceptance -n 4 --report=fixture.json || status=$?
          seconds=$(( $(date +%s) - started ))
          echo "Fixture run: ${seconds} s of the 600 s limit, exit status ${status}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$seconds" -ge 420 ]; then
            echo "::warning title=The acceptance run is slow::It took ${seconds} s; shard it before the 10-minute limit."
          fi
          if [ "$status" -gt 1 ]; then
            echo "::error title=The acceptance run did not finish::pytest exited with status ${status}."
            exit "$status"
          fi
          if [ ! -s acceptance/fixture.json ]; then
            echo "::error title=No report::The run wrote no acceptance/fixture.json."
            exit 1
          fi
      - name: Compare the outcomes with the expected ones
        if: ${{ always() && hashFiles('acceptance/fixture.json') != '' }}
        run: |
          status=0
          pdm run acceptance-expected check acceptance/fixture.json > acceptance/difference.md || status=$?
          { echo "### Outcomes against acceptance/expected/fixture.json"; echo; cat acceptance/difference.md; } >> "$GITHUB_STEP_SUMMARY"
          cat acceptance/difference.md
          exit "$status"
      - name: Render the per-tool report
        if: ${{ always() && hashFiles('acceptance/fixture.json') != '' }}
        run: |
          pdm run python -m nci_si_acceptance.report acceptance/fixture.json > acceptance/report.md
          { echo "### Per-tool report (fixture mode)"; echo; cat acceptance/report.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() && hashFiles('acceptance/fixture.json') != '' }}
        with:
          name: acceptance-fixture
          path: |
            acceptance/fixture.json
            acceptance/report.md
          if-no-files-found: error
          retention-days: 30

  # Offered as a required check for the owner; this change does not alter branch rulesets.
  acceptance-http:
    name: acceptance (HTTP fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Run every applicable remote fixture case and report required skips
        run: pdm run acceptance-http
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() && hashFiles('acceptance/http-fixture.json') != '' }}
        with:
          name: acceptance-http-fixture
          path: acceptance/http-fixture.json
          if-no-files-found: error
          retention-days: 30

  # The acceptance harness's own tests, shared out between three jobs that run at once
  # (selftests/conftest.py); each keeps its coverage data for the coverage job. They set the
  # pace of CI: add a shard when one takes more than about four minutes.
  selftest:
    name: selftest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      # The minimum applies to the shards together, in the coverage job.
      - run: pdm run acceptance-selftest --cov-fail-under=0
        env:
          SELFTEST_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: selftest-coverage-${{ strategy.job-index }}
          path: acceptance/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The self-tests' coverage over all three shards, with the harness's minimum
  # (acceptance/pyproject.toml); falling short of the aim is reported, not enforced.
  coverage:
    name: coverage
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: selftest-coverage-*
          path: selftest-coverage
      - name: Combine the shards and enforce the minimum
        run: |
          pdm run coverage combine --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest selftest-coverage/*/.coverage
          pdm run coverage report --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest
          total="$(pdm run coverage report --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest --format=total)"
          echo "Self-test coverage ${total}% (the aim is above 95%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v total="$total" 'BEGIN { exit !(total <= 95) }'; then
            echo "::warning title=Self-test coverage is not above 95%::${total}%. Cover the untested behaviour; do not pad."
          fi
      - name: Export measured harness coverage
        run: pdm run coverage json --rcfile=acceptance/pyproject.toml --data-file=.coverage-selftest -o tmp/coverage/harness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: badge-coverage-harness
          path: tmp/coverage/harness.json
          if-no-files-found: error
          retention-days: 30

  coverage-badges-render:
    name: render coverage badges
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: badge-coverage-*
          merge-multiple: true
          path: tmp/coverage
      - name: Render badges and source measurements
        run: pdm run python scripts/coverage_badges.py tmp/coverage tmp/coverage-badges
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: badge-data-${{ github.sha }}
          path: |
            tmp/coverage-badges/server.json
            tmp/coverage-badges/harness.json
            tmp/coverage-badges/provenance.json
          if-no-files-found: error
          retention-days: 1

  coverage-badges:
    name: publish coverage badges
    needs: [changes, quality, test, coverage, acceptance, acceptance-http, image, documentation, companions, coverage-badges-render]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only fixed data publication; no checkout or repository execution
    concurrency:
      group: coverage-badges-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: badge-data-${{ github.sha }}
          path: tmp/coverage-badges
      - name: Publish generated badge data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "main has moved; leave publication to its successful CI run."
            exit 0
          fi
          gh auth setup-git
          directory="$RUNNER_TEMP/coverage-badges"
          git init --quiet --initial-branch=coverage-badges "$directory"
          git -C "$directory" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          existing="$(git -C "$directory" ls-remote --heads origin coverage-badges)"
          if [ -n "$existing" ]; then
            git -C "$directory" fetch --depth=1 origin coverage-badges
            git -C "$directory" reset --hard FETCH_HEAD
          fi
          cp tmp/coverage-badges/server.json tmp/coverage-badges/harness.json tmp/coverage-badges/provenance.json "$directory/"
          git -C "$directory" config user.name "Coverage CI"
          git -C "$directory" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$directory" add server.json harness.json provenance.json
          if git -C "$directory" diff --cached --quiet; then exit 0; fi
          git -C "$directory" commit -m "ci: refresh coverage badges"
          git -C "$directory" push origin HEAD:refs/heads/coverage-badges
