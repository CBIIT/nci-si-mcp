name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Every commit on
# main gets its own run, which is never cancelled or replaced: it validates the
# commit that a release is cut from.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pre-commit hooks, on all files. A commit checks only the files it changes,
  # so this also catches a file that a change elsewhere (a rule, a pin) put in breach.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: "3.14"
          version: "2.29.2"
          cache: true
          # An environment built from another lock file may hold packages this one dropped.
          cache-restore-exact-match: true
      # --check fails on a lock file that no longer matches pyproject.toml.
      - run: pdm install --check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pdm run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false
      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: ${{ matrix.python-version }}
          version: "2.29.2"
          cache: true
          # An environment built from another lock file may hold packages this one dropped.
          cache-restore-exact-match: true
      - run: pdm install --check
      - name: Confirm the interpreter under test
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: pdm run python -c "import os, sys; assert sys.version.startswith(os.environ['EXPECTED'] + '.'), sys.version"
      # The suite with line and branch coverage; it fails below the minimum in pyproject.toml.
      - run: pdm run test
      # Falling short of the aim is reported, not enforced (CONTRIBUTING.md, standard 3).
      - name: Report coverage against the aim
        run: |
          total="$(pdm run coverage report --format=total)"
          echo "Coverage ${total}% (the aim is above 95%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v total="$total" 'BEGIN { exit !(total <= 95) }'; then
            echo "::warning title=Coverage is not above 95%::${total}%. Cover the untested behaviour; do not pad."
          fi
      # The acceptance harness's own tests, with its own coverage minimum.
      - run: pdm run acceptance-selftest
