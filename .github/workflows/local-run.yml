name: Local run

# The documented local setup, walked literally on a clean runner of each platform a developer
# uses (macOS first, Linux). Each `run:` line is copied from the document that tells a developer
# to run it, in document order; tests/test_local_run_workflow.py compares them and lists, with a
# reason each, the few lines that exist only in CI. The runs use the live EVS service as the
# documents do (not a required check, so an outage cannot block a pull request); only the
# acceptance run uses fixtures, as acceptance/README.md says. Containers are not run: macOS
# runners have no container runtime, and the CI `image` and `companions` jobs cover Linux.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - pdm.lock
      - docs/site-assets/package.json
      - docs/site-assets/package-lock.json
      - README.md
      - QUICKSTART.md
      - CONTRIBUTING.md
      - acceptance/README.md
      - docs/documentation-site.md
      - docs/local-guide.md
      - docs/local-validation.md
      - docs/installer-targets.md
      - scripts/portal*.py
      - scripts/operator_*.py
      - scripts/docs_site.py
      - .github/workflows/local-run.yml

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress; every commit on main keeps its own.
concurrency:
  group: local-run-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-run:
    name: local run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, combination: server, server: true, index: false, host_docs: false, host_companion: false, compose_docs: false, compose_companion: false, processes: "installer stdio, then installer HTTP", ports: "8000"}
          - {os: ubuntu-24.04, combination: server-index, server: true, index: true, host_docs: false, host_companion: false, compose_docs: false, compose_companion: false, processes: "installer stopped, then required-index HTTP", ports: "8000"}
          - {os: ubuntu-24.04, combination: docs, server: false, index: false, host_docs: false, host_companion: false, compose_docs: true, compose_companion: false, processes: "Compose documentation", ports: "8080"}
          - {os: ubuntu-24.04, combination: companion, server: false, index: false, host_docs: false, host_companion: false, compose_docs: false, compose_companion: true, processes: "Compose administration and ingress", ports: "8081"}
          - {os: ubuntu-24.04, combination: everything, server: true, index: true, host_docs: false, host_companion: false, compose_docs: true, compose_companion: true, processes: "required-index HTTP, Compose documentation, administration and ingress", ports: "8000,8080,8081"}
          - {os: macos-latest, combination: server, server: true, index: false, host_docs: false, host_companion: false, compose_docs: false, compose_companion: false, processes: "installer stdio, then installer HTTP", ports: "8000"}
          - {os: macos-latest, combination: everything-without-docker, server: true, index: true, host_docs: true, host_companion: true, compose_docs: false, compose_companion: false, processes: "required-index HTTP, host documentation and portal", ports: "8000,8080,8081"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version is derived from the nearest tag
          persist-credentials: false

      # The runner image ships python.org builds in /Library/Frameworks, linked from /usr/local/bin,
      # that a clean Mac lacks; PDM picks them over Homebrew's python@3.14. Remove them first.
      - name: Remove the runner's python.org Python (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo find /usr/local/bin -lname '*Library/Frameworks/Python.framework/*' -delete
          sudo rm -rf /Library/Frameworks/Python.framework
      # `brew install` exits 0 without installing a formula the runner image already ships, so the
      # in-use checks below could pass without the documented install having run. A failed
      # uninstall fails the job.
      - name: Remove preinstalled Python and PDM (macOS)
        if: runner.os == 'macOS'
        run: |
          if brew list --versions python@3.14 >/dev/null; then brew uninstall --ignore-dependencies python@3.14; fi
          if brew list --versions pdm >/dev/null; then brew uninstall --ignore-dependencies pdm; fi
      # QUICKSTART, "Platforms and prerequisites": Python and PDM by the documented route.
      # Not actions/setup-python or setup-pdm, which are the tuned path.
      - name: Install Python and PDM (macOS)
        if: runner.os == 'macOS'
        run: brew install python@3.14 pdm && pdm use -f "$(command -v python3.14)"
      - name: Install uv (Linux)
        if: runner.os == 'Linux'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      # The documents say "in a new shell"; a job's next step sees the path added here.
      - name: Open a new shell (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python and PDM (Linux)
        if: runner.os == 'Linux'
        run: |
          uv python install 3.14
          uv tool install pdm

      - name: Install the project
        run: pdm install

      # A copy of Python or PDM that the runner image ships must not take over unnoticed.
      - name: Check that the documented Python and PDM are in use (macOS)
        if: runner.os == 'macOS'
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$(command -v pdm)" = "$(brew --prefix)/bin/pdm" ] || fail "pdm is $(command -v pdm), not the Homebrew install"
          version="$(pdm run python -c "import sys; print('%d.%d' % sys.version_info[:2])" | tail -n 1)"
          [ "$version" = "3.14" ] || fail "the project runs Python $version, not 3.14"
          base="$(pdm run python -c "import sys; print(sys.base_prefix)" | tail -n 1)"
          formula="$(brew --prefix python@3.14)"
          case "$base" in "$formula"/*) ;; *) fail "the project's Python is $base, not Homebrew's python@3.14 ($formula)" ;; esac
      - name: Check that the documented Python and PDM are in use (Linux)
        if: runner.os == 'Linux'
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$(command -v pdm)" = "$HOME/.local/bin/pdm" ] || fail "pdm is $(command -v pdm), not the uv tool install"
          version="$(pdm run python -c "import sys; print('%d.%d' % sys.version_info[:2])" | tail -n 1)"
          [ "$version" = "3.14" ] || fail "the project runs Python $version, not 3.14"
          base="$(pdm run python -c "import sys; print(sys.base_prefix)" | tail -n 1)"
          managed="$(uv python dir)"
          case "$base" in "$managed"/*) ;; *) fail "the project's Python is $base, not a uv-managed one under $managed" ;; esac

      # QUICKSTART: first commands, live EVS, and a small local index.
      - name: Print the EVS release
        run: pdm run nci-si-mcp release-info
      - name: Select the released index source (CI only)
        if: matrix.server || matrix.index
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RELEASE_TAG=v0.0.0
            git tag "$RELEASE_TAG" HEAD
            git config --global url."file://$GITHUB_WORKSPACE/".insteadOf https://github.com/CBIIT/nci-si-mcp
          else
            RELEASE_TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install the optional local index
        if: matrix.server || matrix.index
        run: |
          INDEX_VENV="$RUNNER_TEMP/index-venv"
          SERVER_VENV="$RUNNER_TEMP/server-venv"
          python3.14 -m venv "$SERVER_VENV"
          "$SERVER_VENV/bin/python" -m pip install "nci-si-mcp[server] @ git+https://github.com/CBIIT/nci-si-mcp@${RELEASE_TAG}"
          echo "SERVER_VENV=$SERVER_VENV" >> "$GITHUB_ENV"
          if [ "${{ matrix.index }}" = "true" ]; then
            python3.14 -m venv "$INDEX_VENV"
            "$INDEX_VENV/bin/python" -m pip install "nci-si-mcp[server,index] @ git+https://github.com/CBIIT/nci-si-mcp@${RELEASE_TAG}"
            echo "INDEX_VENV=$INDEX_VENV" >> "$GITHUB_ENV"
          fi
          echo "INDEX_DATA=$RUNNER_TEMP/index-data" >> "$GITHUB_ENV"
      - name: Verify the local server lifecycle
        if: matrix.server
        timeout-minutes: 5
        run: |
          set -euo pipefail
          STDIO_ROOT="$RUNNER_TEMP/guide-stdio"
          HTTP_ROOT="$RUNNER_TEMP/guide-http"
          mkdir -p "$STDIO_ROOT" "$HTTP_ROOT"
          "$SERVER_VENV/bin/nci-si-install" check --target local
          "$SERVER_VENV/bin/nci-si-install" run --target local --transport stdio --data-dir "$STDIO_ROOT" --non-interactive
          "$SERVER_VENV/bin/nci-si-install" status --target local --transport stdio --data-dir "$STDIO_ROOT"
          "$SERVER_VENV/bin/nci-si-install" uninstall --target local --transport stdio --data-dir "$STDIO_ROOT"
          "$SERVER_VENV/bin/nci-si-install" run --target local --transport http --data-dir "$HTTP_ROOT" --non-interactive
          "$SERVER_VENV/bin/nci-si-install" status --target local --transport http --data-dir "$HTTP_ROOT"
          "$SERVER_VENV/bin/nci-si-install" start --target local --transport http --data-dir "$HTTP_ROOT"
          curl --fail --silent http://127.0.0.1:8000/ready
          "$SERVER_VENV/bin/nci-si-install" stop --target local --transport http --data-dir "$HTTP_ROOT"
          "$SERVER_VENV/bin/nci-si-install" uninstall --target local --transport http --data-dir "$HTTP_ROOT"
      - name: Build and evaluate a small local index
        if: matrix.index
        run: |
          export NCI_SI_DATA_DIR="$INDEX_DATA"
          "$INDEX_VENV/bin/nci-si-mcp" index-sample C3262 C2991 C40704 C153397 C116938
          "$INDEX_VENV/bin/nci-si-mcp" evaluate

      # Probes for the servers QUICKSTART tells a developer to start: each starts the documented
      # command, waits (bounded) until it answers, and stops it.
      - name: Write the readiness probe (CI only)
        run: |
          cat > "$RUNNER_TEMP/ready.py" <<'PY'
          import os, signal, subprocess, sys, time, urllib.request

          url, command = sys.argv[1], sys.argv[2:]
          owned = command[:1] != ["--pid"]
          server = (subprocess.Popen(command, start_new_session=True) if owned else None)
          pid = server.pid if server else int(command[1])
          def running():
              if server is not None:
                  return server.poll() is None
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  return False
              return True
          try:
              deadline = time.monotonic() + 90
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as reply:
                          if running():
                              print(url, reply.status, reply.read().decode())
                              break
                  except OSError:
                      pass
                  if not running() or time.monotonic() > deadline:
                      sys.exit("not ready: " + url)
                  time.sleep(1)
          finally:
              if server is not None:
                  try:
                      os.killpg(pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  status = server.wait(timeout=30)
          # pdm run reports a child that the SIGTERM ended as 256 - 15.
          if server is not None and status not in (0, -signal.SIGTERM, 256 - signal.SIGTERM):
              sys.exit(f"the server stopped with status {status}")
          PY
      - name: Serve over stdio and initialize (CI only)
        if: matrix.server
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import json, subprocess

          request = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {},
              "clientInfo": {"name": "local-run", "version": "0"}}}
          server = subprocess.Popen(["pdm", "run", "nci-si-mcp", "serve"], stdin=subprocess.PIPE,
                                    stdout=subprocess.PIPE, text=True)
          try:
              server.stdin.write(json.dumps(request) + "\n")
              server.stdin.flush()
              reply = json.loads(server.stdout.readline())
              assert reply["id"] == 1 and "serverInfo" in reply["result"], reply
              print("initialize answered by", reply["result"]["serverInfo"])
          finally:
              server.kill()
              server.wait(timeout=30)
          PY
      - name: Verify required-index HTTP and indexed search (CI only)
        if: matrix.index
        timeout-minutes: 3
        run: |
          set -euo pipefail
          server=""
          cleanup() {
            if [ -n "$server" ]; then
              kill "$server" 2>/dev/null || true
              wait "$server" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          export NCI_SI_DATA_DIR="$INDEX_DATA"
          export NCI_SI_HTTP_REQUIRE_INDEX=1
          "$INDEX_VENV/bin/nci-si-mcp" serve --transport streamable-http &
          server=$!
          python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8000/ready --pid "$server"
          "$INDEX_VENV/bin/python" - <<'PY'
          import asyncio
          from mcp.client import Client
          from mcp.client.streamable_http import streamable_http_client

          async def check():
              async with Client(streamable_http_client("http://127.0.0.1:8000/mcp")) as client:
                  arguments = {"terminology": "ncit", "query": "Neoplasm", "mode": "semantic"}
                  reply = await client.call_tool("search_concepts", arguments)
                  result = reply.structured_content
                  concept = result["results"][0]["concept"]
                  assert concept["code"] == "C3262", result
                  assert concept["provenance"]["servedBy"] == "index", result
                  assert concept["provenance"]["source"] == "evs_index", result

          asyncio.run(check())
          PY
      - name: Verify server-only search without an index (CI only)
        if: matrix.index
        timeout-minutes: 3
        run: |
          export NCI_SI_DATA_DIR="$RUNNER_TEMP/server-only-data"
          "$SERVER_VENV/bin/python" - <<'PY'
          import asyncio
          import os
          from mcp.client import Client
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def check():
              server = StdioServerParameters(
                  command=os.environ["SERVER_VENV"] + "/bin/nci-si-mcp",
                  args=["serve"],
                  env={"NCI_SI_DATA_DIR": os.environ["RUNNER_TEMP"] + "/server-only-data"},
              )
              async with Client(stdio_client(server)) as client:
                  arguments = {"terminology": "ncit", "query": "Neoplasm", "mode": "semantic"}
                  reply = await client.call_tool("search_concepts", arguments)
                  result = reply.structured_content
                  assert result["error"]["code"] == "capability_unavailable", result
                  assert "results" not in result, result

          asyncio.run(check())
          PY

      # AGENTS.md: the fixture run, prepared as in CI. Exit status 1 means some tests did not pass,
      # which is for the comparison below to judge; any other status, or no report, is no run.
      - name: Run the acceptance suite against the fixtures
        shell: bash {0}
        run: |
          # shellcheck disable=SC2016 # the single quotes are the documented form
          NCI_SI_ACCEPTANCE_SECURITY_SERVER='python ../scripts/permissions_fixture.py' NCI_SI_ACCEPTANCE_PREPARE='nci-si-mcp index-sample $(cat "$NCI_SI_ACCEPTANCE_INDEX_CODES")' pdm run acceptance -n 4 --dist worksteal --report=fixture.json
          status=$?
          [ "$status" -le 1 ] && [ -s acceptance/fixture.json ] || { echo "::error::The fixture run did not finish (exit status $status)."; exit 1; }
      - name: Compare the outcomes with the expected ones
        run: pdm run acceptance-expected check acceptance/fixture.json

      # QUICKSTART: Node.js 24 or newer, for the documentation site only.
      - name: Remove a preinstalled Node.js (macOS)
        if: matrix.host_docs && runner.os == 'macOS'
        run: |
          if brew list --versions node >/dev/null; then brew uninstall --ignore-dependencies node; fi
      - name: Install Node.js (macOS)
        if: matrix.host_docs && runner.os == 'macOS'
        run: brew install node
      - name: Install nvm and Node.js (Linux)
        if: (matrix.host_docs || matrix.compose_docs || matrix.compose_companion) && runner.os == 'Linux'
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | bash
          . "$HOME/.nvm/nvm.sh"
          nvm install 24
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Check that the documented Node.js is in use
        if: matrix.host_docs || matrix.compose_docs || matrix.compose_companion
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$RUNNER_OS" in
            macOS) expected="$(brew --prefix)/bin/node" ;;
            *) expected="$HOME/.nvm/versions/node/*/bin/node" ;;
          esac
          # shellcheck disable=SC2254 # the pattern is meant to expand
          case "$(command -v node)" in $expected) ;; *) fail "node is $(command -v node), not the documented install ($expected)" ;; esac
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 24 ? 0 : 1)' || fail "Node.js $(node --version) is older than 24"

      # docs/documentation-site.md, "Build and preview", without the preview server.
      - name: Build the documentation site
        if: matrix.host_docs || matrix.compose_docs || matrix.compose_companion
        run: |
          pdm install -G docs
          npm ci --prefix docs/site-assets --ignore-scripts
          npm audit --prefix docs/site-assets --audit-level high
          npm run build --prefix docs/site-assets
          pdm run docs-build

      - name: Serve host documentation until ready (CI only)
        if: matrix.host_docs
        timeout-minutes: 3
        run: python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8080/health pdm run python -m scripts.static_server --directory tmp/docs-site --port 8080

      # docs/local-validation.md: the validation dashboard, until it answers.
      - name: Serve the validation dashboard until ready (CI only)
        if: matrix.host_companion
        timeout-minutes: 3
        run: python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8081/health pdm run portal serve

      - name: Build selected local container images
        if: matrix.compose_docs || matrix.compose_companion
        timeout-minutes: 15
        run: |
          pdm run python -m scripts.companion_context --site tmp/docs-site
          docker build --platform linux/amd64 --load -t nci-si-docs:local tmp/companion-context/docs
          if [ "${{ matrix.compose_companion }}" = "true" ]; then
            docker build --platform linux/amd64 --load -t nci-si-admin:local tmp/companion-context/admin
          fi
      - name: Verify the selected Compose profiles (CI only)
        if: matrix.compose_docs || matrix.compose_companion
        timeout-minutes: 10
        run: |
          set -euo pipefail
          profiles=()
          services=()
          if [ "${{ matrix.compose_docs }}" = "true" ]; then profiles+=(--profile docs); services+=(documentation); fi
          if [ "${{ matrix.compose_companion }}" = "true" ]; then profiles+=(--profile companion); services+=(admin-ingress administration); fi
          cleanup() { docker compose -f container/compose.local.yaml stop "${services[@]}" || true; docker compose -f container/compose.local.yaml rm -f "${services[@]}" || true; }
          trap cleanup EXIT
          docker compose -f container/compose.local.yaml "${profiles[@]}" up -d
          if [ "${{ matrix.compose_docs }}" = "true" ]; then python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8080/health --pid "$$"; fi
          if [ "${{ matrix.compose_companion }}" = "true" ]; then python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8081/health --pid "$$"; fi

      - name: Verify every selected component together (CI only)
        if: matrix.index && (matrix.host_docs || matrix.compose_docs || matrix.compose_companion)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          pids=()
          services=()
          cleanup() {
            for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; done
            if [ "${#services[@]}" -gt 0 ]; then
              docker compose -f container/compose.local.yaml stop "${services[@]}" || true
              docker compose -f container/compose.local.yaml rm -f "${services[@]}" || true
            fi
          }
          trap cleanup EXIT
          NCI_SI_DATA_DIR="$INDEX_DATA" NCI_SI_HTTP_REQUIRE_INDEX=1 "$INDEX_VENV/bin/nci-si-mcp" serve --transport streamable-http &
          pids+=("$!")
          python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8000/ready --pid "${pids[0]}"
          if [ "${{ matrix.host_docs }}" = "true" ]; then
            pdm run python -m scripts.static_server --directory tmp/docs-site --port 8080 & pids+=("$!")
            pdm run portal serve & pids+=("$!")
            python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8080/health --pid "${pids[1]}"
            python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8081/health --pid "${pids[2]}"
          else
            docker compose -f container/compose.local.yaml --profile docs --profile companion up -d
            services=(documentation admin-ingress administration)
            python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8080/health --pid "$$"
            python3 "$RUNNER_TEMP/ready.py" http://127.0.0.1:8081/health --pid "$$"
          fi
